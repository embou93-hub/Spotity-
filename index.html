<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Spotity</title>

<style>
:root{
    --black:#000;
    --dark:#0d0d0d;
    --dark2:#121212;
    --card:#181818;
    --card2:#222;
    --hover:#292929;
    --white:#fff;
    --grey:#b3b3b3;
    --green:#1DB954;
    --green2:#1ed760;
    --sidebar:240px;
    --player:82px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

button{
    border:0;
    background:none;
    color:inherit;
    font-family:inherit;
    cursor:pointer;
}

input{
    font-family:inherit;
}

/* =========================
   APP
========================= */

.app{
    height:100vh;
    display:flex;
    overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:var(--sidebar);
    height:100%;
    background:#000;
    padding:18px 10px 10px;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px 22px;
    font-size:23px;
    font-weight:800;
}

.logo-icon{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--green);
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-icon svg{
    width:20px;
    height:20px;
}

.nav-list{
    list-style:none;
    margin-bottom:25px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px 13px;
    border-radius:8px;
    color:var(--grey);
    font-size:14px;
    font-weight:600;
    margin-bottom:3px;
    transition:.2s;
}

.nav-item svg{
    width:20px;
    height:20px;
    fill:currentColor;
}

.nav-item:hover{
    background:#181818;
    color:#fff;
}

.nav-item.active{
    background:#242424;
    color:#fff;
}

.sidebar-title{
    padding:0 12px 10px;
    color:var(--grey);
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-transform:uppercase;
}

.add-btn{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#1d1d1d;
    display:flex;
    align-items:center;
    justify-content:center;
}

.add-btn:hover{
    background:#333;
}

.playlist-sidebar{
    flex:1;
    overflow-y:auto;
    list-style:none;
    min-height:0;
}

.playlist-sidebar::-webkit-scrollbar{
    width:5px;
}

.playlist-sidebar::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

.playlist-side-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 10px;
    border-radius:7px;
    color:var(--grey);
    font-size:13px;
    cursor:pointer;
}

.playlist-side-item:hover{
    background:#181818;
    color:#fff;
}

.playlist-side-item.active{
    background:#242424;
    color:#fff;
}

.playlist-side-item img{
    width:34px;
    height:34px;
    border-radius:5px;
    object-fit:cover;
}

.profile{
    border-top:1px solid #222;
    margin-top:10px;
    padding:12px 10px;
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#282828;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.profile-name{
    font-size:13px;
    font-weight:600;
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    overflow-y:auto;
    background:#121212;
    position:relative;
}

.main::-webkit-scrollbar{
    width:7px;
}

.main::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}

.topbar{
    height:62px;
    position:sticky;
    top:0;
    z-index:15;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    padding:0 22px;
}

.top-btn{
    background:#242424;
    border-radius:20px;
    padding:9px 14px;
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:7px;
}

.top-btn:hover{
    background:#333;
}

.top-btn svg{
    width:15px;
    height:15px;
    fill:currentColor;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.section{
    padding:0 25px 120px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 15px;
}

.section-title{
    font-size:25px;
    font-weight:800;
}

.section-sub{
    margin-top:5px;
    color:var(--grey);
    font-size:12px;
}

/* =========================
   PLAYLIST CARDS
========================= */

.playlist-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
    gap:17px;
}

.playlist-card{
    position:relative;
    overflow:hidden;
    padding:13px;
    border-radius:10px;
    background:#181818;
    cursor:pointer;
    transition:.2s;
}

.playlist-card:hover{
    background:#272727;
    transform:translateY(-2px);
}

.playlist-cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:11px;
}

.playlist-card h3{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playlist-card p{
    margin-top:4px;
    color:var(--grey);
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-play{
    position:absolute;
    right:15px;
    bottom:58px;
    width:39px;
    height:39px;
    border-radius:50%;
    background:var(--green);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(7px);
    transition:.2s;
    box-shadow:0 5px 15px #000;
}

.playlist-card:hover .card-play{
    opacity:1;
    transform:translateY(0);
}

.card-play svg{
    width:18px;
    height:18px;
    fill:currentColor;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:50px 20px;
    text-align:center;
    color:var(--grey);
}

.empty-icon{
    font-size:42px;
    margin-bottom:15px;
}

.empty h3{
    color:#fff;
    margin-bottom:8px;
}

/* =========================
   PLAYLIST HEADER
========================= */

.playlist-hero{
    position:relative;
    min-height:300px;
    padding:35px 30px;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    background:#202020;
}

.playlist-hero-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
}

.playlist-hero-bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top,#121212 0%,rgba(18,18,18,.55) 50%,rgba(0,0,0,.15));
}

.playlist-hero-content{
    position:relative;
    z-index:2;
    display:flex;
    gap:25px;
    align-items:flex-end;
    width:100%;
}

.playlist-big-cover{
    width:190px;
    height:190px;
    object-fit:cover;
    border-radius:8px;
    box-shadow:0 10px 30px #000;
}

.playlist-info{
    min-width:0;
    flex:1;
}

.playlist-label{
    font-size:11px;
    text-transform:uppercase;
    font-weight:800;
}

.playlist-name{
    font-size:clamp(30px,5vw,58px);
    line-height:1;
    font-weight:900;
    margin:10px 0;
    word-break:break-word;
}

.playlist-description{
    color:#ccc;
    font-size:13px;
}

.playlist-actions{
    display:flex;
    gap:8px;
    margin-top:17px;
    flex-wrap:wrap;
}

.action-btn{
    padding:9px 13px;
    border-radius:20px;
    background:#282828;
    font-size:11px;
    font-weight:700;
}

.action-btn:hover{
    background:#3a3a3a;
}

.action-btn.green{
    background:var(--green);
    color:#000;
}

.action-btn.danger{
    background:#3b1717;
    color:#ff8888;
}

/* =========================
   SONG LIST
========================= */

.song-list{
    padding:10px 25px 120px;
}

.song{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:58px;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
}

.song:hover{
    background:#242424;
}

.song-number{
    width:25px;
    text-align:center;
    color:#999;
    font-size:12px;
}

.song-cover{
    width:44px;
    height:44px;
    border-radius:5px;
    object-fit:cover;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-title{
    font-size:13px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    color:#aaa;
    font-size:11px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-duration{
    color:#999;
    font-size:11px;
    min-width:38px;
    text-align:right;
}

.song-fav{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.song-fav svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:#aaa;
    stroke-width:2;
}

.song-fav.active svg{
    fill:var(--green);
    stroke:var(--green);
}

.song-menu{
    width:28px;
    height:28px;
    color:#aaa;
    font-size:18px;
}

/* =========================
   PLAYER
========================= */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:var(--player);
    background:rgba(18,18,18,.97);
    backdrop-filter:blur(15px);
    border-top:1px solid #292929;
    z-index:100;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:15px;
}

.player-left{
    width:25%;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:10px;
}

.player-cover{
    width:50px;
    height:50px;
    border-radius:6px;
    object-fit:cover;
    background:#282828;
}

.player-meta{
    min-width:0;
}

.player-title{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    color:#aaa;
    font-size:11px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-center{
    flex:1;
    max-width:650px;
    margin:auto;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-bottom:5px;
}

.control{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
}

.control:hover{
    color:#fff;
}

.control.active{
    color:var(--green);
}

.control svg{
    width:17px;
    height:17px;
    fill:currentColor;
}

.play-main{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.play-main:hover{
    transform:scale(1.06);
}

.play-main svg{
    width:18px;
    height:18px;
    fill:currentColor;
}

.progress{
    display:flex;
    align-items:center;
    gap:8px;
    color:#999;
    font-size:10px;
}

.range{
    flex:1;
    height:4px;
    appearance:none;
    -webkit-appearance:none;
    background:#444;
    border-radius:10px;
    outline:none;
}

.range::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
}

.player-right{
    width:25%;
    min-width:130px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:8px;
}

.player-right svg{
    width:17px;
    height:17px;
    fill:#aaa;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,100%);
    background:#202020;
    border-radius:14px;
    padding:24px;
    box-shadow:0 20px 60px #000;
}

.modal-box h2{
    font-size:20px;
    margin-bottom:8px;
}

.modal-box p{
    color:#aaa;
    font-size:12px;
    line-height:1.5;
    margin-bottom:18px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.modal-btn{
    padding:9px 15px;
    border-radius:20px;
    background:#333;
    font-size:12px;
    font-weight:700;
}

.modal-btn.green{
    background:var(--green);
    color:#000;
}

.modal-btn.red{
    background:#a52c2c;
    color:#fff;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:105px;
    transform:translateX(-50%) translateY(20px);
    background:#282828;
    padding:11px 16px;
    border-radius:8px;
    font-size:12px;
    z-index:500;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    box-shadow:0 5px 25px #000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    :root{
        --sidebar:64px;
        --player:76px;
    }

    .sidebar{
        padding:15px 5px 5px;
    }

    .logo{
        justify-content:center;
        padding:0 0 20px;
    }

    .logo span{
        display:none;
    }

    .nav-item{
        justify-content:center;
        padding:11px 5px;
    }

    .nav-item span{
        display:none;
    }

    .sidebar-title,
    .playlist-sidebar,
    .profile-name{
        display:none;
    }

    .profile{
        justify-content:center;
        border-top:0;
    }

    .topbar{
        padding:0 10px;
    }

    .top-btn{
        padding:8px 10px;
        font-size:10px;
    }

    .section{
        padding-left:15px;
        padding-right:15px;
    }

    .playlist-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .playlist-card{
        padding:9px;
    }

    .playlist-hero{
        min-height:250px;
        padding:20px 15px;
    }

    .playlist-hero-content{
        gap:14px;
    }

    .playlist-big-cover{
        width:120px;
        height:120px;
    }

    .playlist-name{
        font-size:28px;
    }

    .playlist-actions{
        gap:5px;
    }

    .action-btn{
        padding:7px 9px;
        font-size:9px;
    }

    .song-list{
        padding:10px 10px 100px;
    }

    .song-number{
        display:none;
    }

    .song{
        gap:8px;
    }

    .song-cover{
        width:42px;
        height:42px;
    }

    .player{
        padding:0 8px;
        gap:5px;
    }

    .player-left{
        width:auto;
        min-width:0;
        flex:1;
    }

    .player-cover{
        width:42px;
        height:42px;
    }

    .player-center{
        flex:0 0 auto;
        width:auto;
    }

    .controls{
        gap:3px;
        margin:0;
    }

    .controls .secondary{
        display:none;
    }

    .player-right{
        display:none;
    }

    .progress{
        display:none;
    }

    .player-title{
        max-width:115px;
        font-size:11px;
    }

    .player-artist{
        max-width:115px;
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100">
                    <path d="M28 30L28 70M42 25L42 75M56 20L56 80M70 25L70 75"
                          stroke="#000"
                          stroke-width="9"
                          stroke-linecap="round"/>
                </svg>
            </div>
            <span>Spotity</span>
        </div>

        <ul class="nav-list">
            <li class="nav-item active" data-view="home">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 9h3v11h5v-6h4v6h5V9h3L12 2z"/>
                </svg>
                <span>Accueil</span>
            </li>

            <li class="nav-item" data-view="library">
                <svg viewBox="0 0 24 24">
                    <path d="M4 3h16v2H4V3zm0 4h16v2H4V7zm0 4h16v2H4v-2zm0 4h11v2H4v-2zm0 4h11v2H4v-2z"/>
                </svg>
                <span>Bibliothèque</span>
            </li>
        </ul>

        <div class="sidebar-title">
            <span>Mes playlists</span>
            <button class="add-btn" id="create-playlist">
                +
            </button>
        </div>

        <ul class="playlist-sidebar" id="playlist-sidebar"></ul>

        <div class="profile">
            <div class="profile-avatar">👤</div>
            <span class="profile-name" id="profile-name">Utilisateur</span>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main" id="main">

        <div class="topbar">

            <button class="top-btn" id="import-m3u">
                <svg viewBox="0 0 24 24">
                    <path d="M5 20h14v-2H5v2zm7-18L5.3 9h3.8v6h5.8V9h3.8L12 2z"/>
                </svg>
                M3U
            </button>

            <button class="top-btn" id="import-audio">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Musiques
            </button>

        </div>

        <!-- HOME -->
        <section class="view active" id="view-home">

            <div class="section">

                <div class="section-head">
                    <div>
                        <div class="section-title">Mes playlists</div>
                        <div class="section-sub">
                            Tes playlists uniquement.
                        </div>
                    </div>
                </div>

                <div class="playlist-grid" id="playlist-grid"></div>

            </div>

        </section>

        <!-- LIBRARY -->
        <section class="view" id="view-library">

            <div class="section">

                <div class="section-head">
                    <div>
                        <div class="section-title">Titres aimés</div>
                        <div class="section-sub">
                            Tes musiques favorites.
                        </div>
                    </div>
                </div>

            </div>

            <div class="song-list" id="library-list"></div>

        </section>

    </main>

</div>

<!-- PLAYER -->
<footer class="player">

    <div class="player-left">

        <img id="player-cover"
             class="player-cover"
             alt="Cover">

        <div class="player-meta">
            <div id="player-title" class="player-title">
                Aucune chanson
            </div>

            <div id="player-artist" class="player-artist">
                Spotity
            </div>
        </div>

        <button id="player-favorite" class="song-fav">
            <svg viewBox="0 0 24 24">
                <path d="M12 21.3l-1.4-1.3C5.4 15.4 2 12.3 2 8.5
                         2 5.4 4.4 3 7.5 3
                         c1.7 0 3.4.8 4.5 2.1
                         C13.1 3.8 14.8 3 16.5 3
                         C19.6 3 22 5.4 22 8.5
                         c0 3.8-3.4 6.9-8.6 11.5z"/>
            </svg>
        </button>

    </div>

    <div class="player-center">

        <div class="controls">

<script>
"use strict";

/* ============================================================
   SPOTITY
   VERSION PERSISTANTE AVEC INDEXEDDB
============================================================ */

/* =========================
   DATABASE
========================= */

const DB_NAME = "SpotityDB";
const DB_VERSION = 1;

let db = null;

function openDB(){

    return new Promise((resolve,reject)=>{

        const request = indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = e => {

            const database = e.target.result;

            if(!database.objectStoreNames.contains("audioFiles")){
                database.createObjectStore("audioFiles");
            }

            if(!database.objectStoreNames.contains("images")){
                database.createObjectStore("images");
            }
        };

        request.onsuccess = e => {
            db = e.target.result;
            resolve(db);
        };

        request.onerror = () => {
            reject(request.error);
        };

    });

}

function dbPut(store,key,value){

    return new Promise((resolve,reject)=>{

        const transaction = db.transaction(store,"readwrite");
        const objectStore = transaction.objectStore(store);

        objectStore.put(value,key);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);

    });

}

function dbGet(store,key){

    return new Promise((resolve,reject)=>{

        const transaction = db.transaction(store,"readonly");
        const objectStore = transaction.objectStore(store);

        const request = objectStore.get(key);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);

    });

}

function dbDelete(store,key){

    return new Promise((resolve,reject)=>{

        const transaction = db.transaction(store,"readwrite");
        transaction.objectStore(store).delete(key);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);

    });

}

/* =========================
   STORAGE
========================= */

const PLAYLISTS_KEY = "spotity_playlists_v2";
const FAVORITES_KEY = "spotity_favorites_v2";
const PROFILE_KEY = "spotity_profile_v2";
const PLAYER_KEY = "spotity_player_v2";

let playlists = [];
let favorites = [];
let profile = {
    name:"Utilisateur"
};

let currentPlaylist = null;
let currentSongIndex = -1;
let isPlaying = false;
let shuffle = false;
let repeat = "off";
let currentObjectURL = null;

const audio = document.getElementById("audio");

/* =========================
   HELPERS
========================= */

function uid(prefix="id"){

    return prefix + "_" +
        Date.now().toString(36) + "_" +
        Math.random().toString(36).slice(2,9);

}

function saveData(){

    localStorage.setItem(
        PLAYLISTS_KEY,
        JSON.stringify(playlists)
    );

}

function saveFavorites(){

    localStorage.setItem(
        FAVORITES_KEY,
        JSON.stringify(favorites)
    );

}

function saveProfile(){

    localStorage.setItem(
        PROFILE_KEY,
        JSON.stringify(profile)
    );

}

function savePlayerState(){

    if(!currentPlaylist || currentSongIndex < 0){
        localStorage.removeItem(PLAYER_KEY);
        return;
    }

    const state = {
        playlistId:currentPlaylist.id,
        songId:currentPlaylist.songs[currentSongIndex]?.id || null,
        currentTime:audio.currentTime || 0,
        volume:audio.volume,
        shuffle,
        repeat
    };

    localStorage.setItem(
        PLAYER_KEY,
        JSON.stringify(state)
    );

}

function loadStoredData(){

    try{
        playlists = JSON.parse(
            localStorage.getItem(PLAYLISTS_KEY) || "[]"
        );
    }catch{
        playlists = [];
    }

    try{
        favorites = JSON.parse(
            localStorage.getItem(FAVORITES_KEY) || "[]"

    }catch{
        favorites = [];
    }

    try{
        profile = JSON.parse(
            localStorage.getItem(PROFILE_KEY) || '{"name":"Utilisateur"}'
        );
    }catch{
        profile = {name:"Utilisateur"};
    }

}

/* =========================
   COVERS
========================= */

function generatedCover(title){

    const safe = String(title || "Spotity")
        .replace(/[<>&"]/g,"")
        .slice(0,22);

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1DB954"/>
                <stop offset="100%" stop-color="#101010"/>
            </linearGradient>
        </defs>

        <rect width="600" height="600" fill="url(#g)"/>

        <circle cx="300" cy="270" r="120"
                fill="rgba(0,0,0,.25)"/>

        <text x="300" y="290"
              text-anchor="middle"
              font-family="Arial"
              font-size="55"
              font-weight="bold"
              fill="white">
            ${safe}
        </text>

        <text x="300" y="370"
              text-anchor="middle"
              font-family="Arial"
              font-size="28"
              fill="white"
              opacity=".7">
            SPOTITY
        </text>
    </svg>`;

    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

}

/* =========================
   SONGS
========================= */

function allSongs(){

    return playlists.flatMap(p => p.songs || []);

}

function getSong(id){

    return allSongs().find(s => s.id === id);

}

function getPlaylist(id){

    return playlists.find(p => p.id === id);

}

function favorite(id){

    return favorites.includes(id);

}

function toggleFavorite(id){

    if(favorite(id)){
        favorites = favorites.filter(x => x !== id);
    }else{
        favorites.push(id);
    }

    saveFavorites();

    renderCurrentView();
    updatePlayerFavorite();

/* =========================
   TOAST
========================= */

let toastTimer;

function toast(message){

    const el = document.getElementById("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{
        el.classList.remove("show");
    },2600);

}

/* =========================
   FILE STORAGE
========================= */

async function saveAudioFile(file){

    const id = uid("audio");

    await dbPut("audioFiles",id,file);

    return id;

}

async function getAudioFile(id){

    return await dbGet("audioFiles",id);

}

async function saveImage(file){

    const id = uid("image");

    await dbPut("images",id,file);

    return id;

}

async function getImage(id){

    return await dbGet("images",id);

}

/* =========================
   CREATE PLAYLIST
========================= */

async function createPlaylistFromFiles(files){

    if(!files.length) return;

    const name = prompt(
        "Nom de ta playlist :",
        "Ma playlist"
    );

    if(!name || !name.trim()) return;

    const playlist = {
        id:uid("playlist"),
        name:name.trim(),
        description:"Ma playlist",
        cover:generatedCover(name),
        backgroundImageId:null,
        songs:[]
    };

    for(const file of files){

        if(!file.type.startsWith("audio/")){
            continue;
        }

        const fileId = await saveAudioFile(file);

        playlist.songs.push({

            id:uid("song"),

            title:file.name.replace(/\.[^/.]+$/,""),

            artist:"Fichier local",

            duration:"0:00",

            sourceType:"file",

            fileId:fileId,

            cover:generatedCover(
                file.name.replace(/\.[^/.]+$/,"")
            ),

            playlistId:playlist.id

        });

    }

    if(!playlist.songs.length){

        toast("Aucun fichier audio valide.");
        return;

    }

    playlists.push(playlist);

    saveData();

    await readDurations(playlist);

    saveData();

    renderAll();

    openPlaylist(playlist.id);

    toast(
        playlist.songs.length +
        " musique(s) ajoutée(s)"
    );

}

async function readDurations(playlist){

    for(const song of playlist.songs){

        try{

            const file = await getAudioFile(song.fileId);

            if(!file) continue;

            const url = URL.createObjectURL(file);

            await new Promise(resolve=>{

                const temp = new Audio();

                temp.preload = "metadata";

                temp.onloadedmetadata = ()=>{

                    if(isFinite(temp.duration)){
                        song.duration = formatTime(
                            temp.duration
                        );
                    }

                    URL.revokeObjectURL(url);

                    resolve();

                };

                temp.onerror = ()=>{

                    URL.revokeObjectURL(url);
                    resolve();

                };

                temp.src = url;

            });

        }catch(e){

            console.warn(
                "Impossible de lire la durée",
                song.title,
                e
            );

        }

    }

}

/* =========================
   IMPORT AUDIO
========================= */

function importAudio(){

    const input = document.createElement("input");

    input.type = "file";
    input.multiple = true;
    input.accept = "audio/*";

    input.onchange = async e => {

        const files = Array.from(e.target.files || []);

        if(files.length){
            await createPlaylistFromFiles(files);
        }

    };

    input.click();

}

/* =========================
   M3U
========================= */

function parseM3U(content){

    const lines = content
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

    const songs = [];

    let metadata = null;

    for(const line of lines){

        if(line.startsWith("#EXTINF")){

            const comma = line.indexOf(",");

            let info = comma >= 0
                ? line.slice(comma + 1).trim()
                : "Titre inconnu";

            let artist = "Artiste inconnu";
            let title = info;

            const parts = info.split(" - ");

            if(parts.length >= 2){

                artist = parts.shift().trim();
                title = parts.join(" - ").trim();

            }

            const durationMatch =
                line.match(/#EXTINF:\s*(-?\d+)/);

            metadata = {

                artist,
                title,
                duration:
                    durationMatch
                    ? formatTime(
                        parseInt(durationMatch[1])
                      )
                    : "0:00"

            };

            continue;

        }

        if(
            line.startsWith("http://") ||
            line.startsWith("https://")
        ){

            const data = metadata || {

                artist:"Artiste inconnu",
                title:"Titre inconnu",
                duration:"0:00"

            };

            songs.push({

                id:uid("song"),

                title:data.title,

                artist:data.artist,

                duration:data.duration,

                sourceType:"url",

                url:line,

                cover:generatedCover(data.title)

            });

            metadata = null;

        }

    }

    return songs;

}

function importM3U(){

    const input = document.createElement("input");

    input.type = "file";
    input.accept = ".m3u,.m3u8,audio/x-mpegurl,text/plain";

    input.onchange = e => {

        const file = e.target.files?.[0];

        if(!file) return;

        const reader = new FileReader();

        reader.onload = () => {

            const songs = parseM3U(
                String(reader.result || "")
            );

            if(!songs.length){

                toast(
                    "Aucune URL audio trouvée dans le M3U."
                );

                return;

            }

            const name = prompt(
                "Nom de la playlist M3U :",
                file.name.replace(/\.[^/.]+$/,"")
            );

            if(!name || !name.trim()) return;

            const playlist = {

                id:uid("playlist"),

                name:name.trim(),

                description:"Playlist M3U",

                cover:generatedCover(name),

                backgroundImageId:null,

                songs:[]

            };

            songs.forEach(song=>{

                song.playlistId = playlist.id;

                playlist.songs.push(song);

            });

            playlists.push(playlist);

            saveData();

            renderAll();

            openPlaylist(playlist.id);

            toast(
                songs.length +
                " titre(s) M3U ajouté(s)"
            );

        };

        reader.readAsText(file);

    };

    input.click();

}

/* =========================
   PLAY AUDIO
========================= */

async function resolveSongURL(song){

    if(!song) return null;

    if(song.sourceType === "file"){

        const file = await getAudioFile(song.fileId);

        if(!file){
            throw new Error(
                "Fichier local introuvable."
            );
        }

        if(currentObjectURL){
            URL.revokeObjectURL(currentObjectURL);
        }

        currentObjectURL =
            URL.createObjectURL(file);

        return currentObjectURL;

    }

    if(song.sourceType === "url"){

        if(!song.url){
            throw new Error("URL vide.");
        }

        return song.url;

    }

    /* Migration des anciennes versions */
    if(song.url && !song.url.startsWith("blob:")){

        return song.url;

    }

    throw new Error(
        "Cette ancienne musique locale n'est plus disponible. Réimporte le fichier."
    );

}

async function playSong(playlist,index){

    if(
        !playlist ||
        !playlist.songs ||
        !playlist.songs[index]
    ) return;

    currentPlaylist = playlist;
    currentSongIndex = index;

    const song = playlist.songs[index];

    updatePlayerDisplay();

    try{

        const src = await resolveSongURL(song);

        audio.src = src;

        audio.load();

        await audio.play();

        isPlaying = true;

        updatePlayButton();

        savePlayerState();

    }catch(error){

        console.error(
            "Erreur de lecture:",
            error
        );

        isPlaying = false;

        updatePlayButton();

        toast(
            "Impossible de lire cette musique."
        );

    }

}

function togglePlay(){

    if(!currentPlaylist){

        if(playlists.length){

            playSong(
                playlists[0],
                0
            );

        }else{

            toast(
                "Importe d'abord une musique."
            );

        }

        return;

    }

    if(!audio.src){

        playSong(
            currentPlaylist,
            currentSongIndex >= 0
                ? currentSongIndex
                : 0
        );

        return;

    }

    if(audio.paused){

        audio.play()
            .then(()=>{
                isPlaying = true;
                updatePlayButton();
                savePlayerState();
            })
            .catch(error=>{
                console.error(error);
                toast(
                    "Lecture impossible."
                );
            });

    }else{

        audio.pause();

    }

}

/* =========================
   NEXT / PREVIOUS
========================= */

function nextSong(){

    if(
        !currentPlaylist ||
        !currentPlaylist.songs.length
    ) return;

    let next;

    if(shuffle){

        if(currentPlaylist.songs.length === 1){
            next = 0;
        }else{

            do{
                next =
                    Math.floor(
                        Math.random() *
                        currentPlaylist.songs.length
                    );
            }while(next === currentSongIndex);

        }

    }else{

        next = currentSongIndex + 1;

        if(next >= currentPlaylist.songs.length){

            if(repeat === "all"){
                next = 0;
            }else{

                isPlaying = false;
                updatePlayButton();

                return;

            }

        }

    }

    playSong(
        currentPlaylist,
        next
    );

}

function previousSong(){

    if(!currentPlaylist) return;

    if(audio.currentTime > 3){

        audio.currentTime = 0;
        return;

    }

    let previous =
        currentSongIndex - 1;

    if(previous < 0){

        if(repeat === "all"){
            previous =
                currentPlaylist.songs.length - 1;
        }else{

            audio.currentTime = 0;
            return;

        }

    }

    playSong(
        currentPlaylist,
        previous
    );

}

/* =========================
   PLAYER UI
========================= */

function updatePlayButton(){

    const icon =
        document.getElementById("play-icon");

    if(isPlaying){

        icon.innerHTML =
            '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    }else{

        icon.innerHTML =
            '<path d="M8 5v14l11-7z"/>';

    }

}

function updatePlayerDisplay(){

    const title =
        document.getElementById("player-title");

    const artist =
        document.getElementById("player-artist");

    const cover =
        document.getElementById("player-cover");

    const song =
        currentPlaylist?.songs?.[currentSongIndex];

    if(!song){

        title.textContent =
            "Aucune chanson";

        artist.textContent =
            "Spotity";

        cover.src =
            generatedCover("Spotity");

        return;

    }

    title.textContent =
        song.title;

    artist.textContent =
        song.artist;

    cover.src =

        generatedCover(song.title);

    updatePlayerFavorite();

}

function updatePlayerFavorite(){

    const button =
        document.getElementById(
            "player-favorite"
        );

    const song =
        currentPlaylist?.songs?.[currentSongIndex];

    if(!song){

        button.classList.remove("active");
        return;

    }

    button.classList.toggle(
        "active",
        favorite(song.id)
    );

}

/* =========================
   TIME
========================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){
        return "0:00";
    }

    const mins =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        mins +
        ":" +
        String(secs).padStart(2,"0")
    );

}

audio.addEventListener(
    "timeupdate",
    ()=>{

        const progress =
            document.getElementById("progress");

        const current =
            document.getElementById("current-time");

        progress.max =
            Number.isFinite(audio.duration)
                ? audio.duration
                : 0;

        progress.value =
            audio.currentTime || 0;

        current.textContent =
            formatTime(
                audio.currentTime
            );

    }
);

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        document.getElementById(
            "duration"
        ).textContent =
            formatTime(audio.duration);

        document.getElementById(
            "progress"
        ).max =
            audio.duration || 0;

    }
);

audio.addEventListener(
    "play",
    ()=>{

        isPlaying = true;

        updatePlayButton();

    }
);

audio.addEventListener(
    "pause",
    ()=>{

        isPlaying = false;

        updatePlayButton();

        savePlayerState();

    }
);

audio.addEventListener(
    "ended",
    ()=>{

        if(repeat === "one"){

            audio.currentTime = 0;

            audio.play();

        }else{

            nextSong();

        }

    }
);

audio.addEventListener(
    "error",
    ()=>{

        console.error(
            "Audio error:",
            audio.error
        );

        isPlaying = false;

        updatePlayButton();

        toast(
            "Cette source audio ne peut pas être lue."
        );

    }
);

/* =========================
   PROGRESS
========================= */

document
.getElementById("progress")
.addEventListener(
    "input",
    e=>{

        if(Number.isFinite(audio.duration)){

            audio.currentTime =
                Number(e.target.value);

        }

    }
);

/* =========================
   VOLUME
========================= */

const volume =
    document.getElementById("volume");

const savedVolume =
    localStorage.getItem(
        "spotity_volume"
    );

if(savedVolume !== null){

    audio.volume =
        Number(savedVolume);

    volume.value =
        Number(savedVolume);

}else{

    audio.volume = .7;

}

volume.addEventListener(
    "input",
    ()=>{

        audio.volume =
            Number(volume.value);

        localStorage.setItem(
            "spotity_volume",
            volume.value
        );

        savePlayerState();

    }
);

/* =========================
   SHUFFLE / REPEAT
========================= */

document
.getElementById("shuffle")
.addEventListener(
    "click",
    ()=>{

        shuffle = !shuffle;

        document
            .getElementById("shuffle")
            .classList.toggle(
                "active",
                shuffle
            );

        savePlayerState();

    }
);

document
.getElementById("repeat")
.addEventListener(
    "click",
    ()=>{

        if(repeat === "off"){
            repeat = "all";
        }else if(repeat === "all"){
            repeat = "one";
        }else{
            repeat = "off";
        }

        document
            .getElementById("repeat")
            .classList.toggle(
                "active",
                repeat !== "off"
            );

        savePlayerState();

    }
);

/* =========================
   PLAYLIST RENDER
========================= */

function renderSidebar(){

function renderHome(){

        document.getElementById(
            "playlist-grid"
        );

    if(!playlists.length){

        container.innerHTML = `

            <div class="empty" style="grid-column:1/-1">

    container.innerHTML =
        playlists.map(p=>`

async function getBackgroundURL(playlist){

    if(!playlist.backgroundImageId){
        return null;
    }

    const image =
        await getImage(
            playlist.backgroundImageId
        );

    if(!image) return null;

    return URL.createObjectURL(image);

}

/* =========================
   IMAGE PLAYLIST
========================= */

function choosePlaylistImage(
    playlist,
    type
){

    const input =
        document.createElement("input");

    input.type = "file";
    input.accept = "image/*";

    input.onchange = async e=>{

        const file =
            e.target.files?.[0];

        if(!file) return;

        try{

            const imageId =
                await saveImage(file);

            if(type === "cover"){

                const dataURL =
                    await fileToDataURL(file);

                playlist.cover =
                    dataURL;

            }else{

                playlist.backgroundImageId =
                    imageId;

            }

            saveData();

            renderAll();

            await openPlaylist(
                playlist.id
            );

            toast(
                type === "cover"
                ? "Couverture modifiée ✨"
                : "Fond de playlist modifié 🌌"
            );

        }catch(error){

            console.error(error);

            toast(
                "Impossible d'ajouter cette image."
            );

        }

    };

    input.click();

}

function fileToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                ()=>resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}

/* =========================
   DELETE PLAYLIST
========================= */

async function deletePlaylist(id){

    const playlist =
        getPlaylist(id);

    if(!playlist) return;

    /* Supprimer les fichiers audio de la DB */

    for(const song of playlist.songs){

        if(
            song.sourceType === "file" &&
            song.fileId
        ){

            try{

                await dbDelete(
                    "audioFiles",
                    song.fileId
                );

            }catch{}

        }

    }

    /* Supprimer l'image de fond */

    if(playlist.backgroundImageId){

        try{

            await dbDelete(
                "images",
                playlist.backgroundImageId
            );

        }catch{}

    }

    playlists =
        playlists.filter(
            p=>p.id !== id
        );

    if(
        currentPlaylist &&
        currentPlaylist.id === id
    ){

        audio.pause();

        currentPlaylist = null;
        currentSongIndex = -1;
        isPlaying = false;

        if(currentObjectURL){

            URL.revokeObjectURL(
                currentObjectURL
            );

            currentObjectURL = null;

        }

        localStorage.removeItem(
            PLAYER_KEY
        );

        updatePlayerDisplay();
        updatePlayButton();

    }

    saveData();

    renderAll();

    switchView("home");

    toast(
        "Playlist supprimée."
    );

}

/* =========================
   RESTORE PLAYER
========================= */

async function restorePlayer(){

    const raw =
        localStorage.getItem(
            PLAYER_KEY
        );

    if(!raw) return;

    try{

        const state =
            JSON.parse(raw);

        const playlist =
            getPlaylist(
                state.playlistId
            );

        if(!playlist) return;

        let index =
            playlist.songs.findIndex(
                s=>s.id === state.songId
            );

        if(index < 0) index = 0;

        currentPlaylist =
            playlist;

        currentSongIndex =
            index;

        shuffle =
            !!state.shuffle;

        repeat =
            state.repeat || "off";

        audio.volume =
            Number.isFinite(
                state.volume
            )
            ? state.volume
            : .7;

        volume.value =
            audio.volume;

        updatePlayerDisplay();

        /*
            On restaure la source mais on ne lance
            PAS automatiquement la musique.
        */

        const song =
            playlist.songs[index];

        try{

            const src =
                await resolveSongURL(song);

            audio.src = src;
            audio.load();

            audio.addEventListener(
                "loadedmetadata",
                function restorePosition(){

                    if(
                        Number.isFinite(
                            state.currentTime
                        )
                    ){

                        try{

                            audio.currentTime =
                                Math.min(
                                    state.currentTime,
                                    audio.duration || state.currentTime
                                );

                        }catch{}

                    }

                    audio.removeEventListener(
                        "loadedmetadata",
                        restorePosition
                    );

                }
            );

        }catch(error){

            console.warn(
                "Impossible de restaurer la musique:",
                error
            );

            toast(
                "Une ancienne musique n'est plus disponible."
            );

        }

        document
            .getElementById("shuffle")
            .classList.toggle(
                "active",
                shuffle
            );

        document
            .getElementById("repeat")
            .classList.toggle(
                "active",
                repeat !== "off"
            );

    }catch(error){

        console.warn(
            "Restauration lecteur impossible:",
            error
        );

    }

}

/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =========================
   CLEAN OLD DATA
========================= */

/*
    Les anciennes versions de Spotity pouvaient
    avoir enregistré des blob: URLs dans localStorage.

    Ces URLs sont mortes après fermeture de l'app.
    On les retire pour éviter les playlists cassées.
*/

function cleanOldBlobSongs(){

    let changed = false;

    playlists.forEach(playlist=>{

        playlist.songs =
            (playlist.songs || [])
            .filter(song=>{

                if(
                    song.url &&
                    song.url.startsWith("blob:")
                ){

                    changed = true;

                    return false;

                }

                return true;

            });

    });

    if(changed){

        playlists =
            playlists.filter(
                p=>p.songs.length > 0
            );

        saveData();

    }

}
