<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Spotity</title>

<style>

:root{
    --black:#000;
    --dark:#121212;
    --medium:#181818;
    --light:#282828;
    --lighter:#333;
    --white:#fff;
    --grey:#b3b3b3;
    --green:#1DB954;
    --green2:#1ed760;
    --sidebar:240px;
    --player:82px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

button{
    border:0;
    background:none;
    color:inherit;
    font-family:inherit;
    cursor:pointer;
}

img{
    display:block;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    overflow:hidden;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:var(--sidebar);
    height:100%;
    background:#000;
    padding:18px 10px 10px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 12px 22px;
    font-size:22px;
    font-weight:700;
}

.logo-icon{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--green);
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-icon svg{
    width:20px;
    height:20px;
}

.nav-list{
    list-style:none;
    margin-bottom:25px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    color:var(--grey);
    border-radius:8px;
    margin-bottom:3px;
    font-size:14px;
    font-weight:600;
}

.nav-item:hover,
.nav-item.active{
    color:#fff;
    background:rgba(255,255,255,.1);
}

.nav-item svg{
    width:20px;
    height:20px;
    fill:currentColor;
}

.sidebar-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px 10px;
    color:var(--grey);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
}

.add-playlist{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1d1d1d;
}

.add-playlist:hover{
    background:#333;
}

.add-playlist svg{
    width:15px;
    height:15px;
    fill:#fff;
}

.playlist-sidebar-list{
    list-style:none;
    overflow-y:auto;
    flex:1;
}

.playlist-sidebar-item{
    padding:8px 10px;
    border-radius:7px;
    color:var(--grey);
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.playlist-sidebar-item:hover,
.playlist-sidebar-item.active{
    color:#fff;
    background:#181818;
}

.playlist-sidebar-item img{
    width:34px;
    height:34px;
    border-radius:6px;
    object-fit:cover;
    background:#282828;
}

.playlist-sidebar-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

.profile{
    border-top:1px solid #222;
    padding:12px 5px 4px;
    display:flex;
    align-items:center;
    gap:10px;
}

.profile img{
    width:34px;
    height:34px;
    border-radius:50%;
}

.profile-name{
    flex:1;
    font-size:13px;
    font-weight:600;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    overflow-y:auto;
    background:
        linear-gradient(
            to bottom,
            #202020 0,
            #121212 330px,
            #121212 100%
        );
    -webkit-overflow-scrolling:touch;
}

.topbar{
    position:sticky;
    top:0;
    z-index:10;
    height:64px;
    padding:10px 24px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.import-buttons{
    display:flex;
    gap:8px;
}

.import-btn{
    padding:9px 14px;
    border-radius:20px;
    background:#242424;
    font-size:12px;
    font-weight:700;
}

.import-btn:hover{
    background:#333;
}

/* =========================================================
   VIEWS
========================================================= */

.view{
    display:none;
}

.view.active{
    display:block;
}

.section{
    padding:10px 25px 120px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:15px 0;
}

.section-title{
    font-size:22px;
    font-weight:750;
}

.section-subtitle{
    color:var(--grey);
    font-size:12px;
    margin-top:4px;
}

/* =========================================================
   SEARCH BAR
========================================================= */

.search-container{
    position:relative;
    margin:15px 0;
    width:100%;
    max-width:400px;
}

.search-input{
    width:100%;
    padding:12px 40px 12px 40px;
    border-radius:20px;
    border:0;
    background:#242424;
    color:#fff;
    font-size:13px;
    outline:none;
    transition:all .2s;
}

.search-input:focus{
    background:#282828;
    box-shadow:0 0 0 2px var(--green);
}

.search-input::placeholder{
    color:#888;
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    fill:#888;
    pointer-events:none;
}

.search-clear{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    background:#444;
    color:#fff;
    font-size:12px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.search-clear.visible{
    display:flex;
}

.search-clear:hover{
    background:#555;
}

.no-results{
    color:var(--grey);
    text-align:center;
    padding:40px 20px;
    font-size:13px;
    display:none;
}

.no-results.visible{
    display:block;
}

/* =========================================================
   PLAYLIST GRID
========================================================= */

.playlist-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));
    gap:16px;
}

.playlist-card{
    position:relative;
    padding:14px;
    border-radius:10px;
    background:#181818;
    cursor:pointer;
    transition:.2s;
}

.playlist-card:hover{
    background:#282828;
    transform:translateY(-2px);
}

.playlist-card-cover{
    width:100%;
    aspect-ratio:1;
    border-radius:8px;
    object-fit:cover;
    background:#282828;
    margin-bottom:12px;
}

.playlist-card h3{
    font-size:14px;
    margin-bottom:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playlist-card p{
    color:var(--grey);
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play-btn-card{
    position:absolute;
    right:18px;
    bottom:55px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--green);
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    transform:translateY(5px);
    transition:.2s;
    box-shadow:0 5px 15px #0008;
}

.playlist-card:hover .play-btn-card{
    opacity:1;
    transform:translateY(0);
}

.play-btn-card svg{
    width:18px;
    height:18px;
    fill:#000;
}

/* =========================================================
   PLAYLIST VIEW
========================================================= */

.playlist-header{
    display:flex;
    gap:20px;
    align-items:flex-end;
    margin-bottom:25px;
}

.playlist-header-cover{
    width:190px;
    height:190px;
    border-radius:8px;
    object-fit:cover;
    background:#282828;
    box-shadow:0 8px 30px #0008;
}

.playlist-header-info{
    min-width:0;
}

.playlist-header-small{
    text-transform:uppercase;
    font-size:11px;
    font-weight:700;
    color:#fff;
}

.playlist-header-title{
    font-size:42px;
    font-weight:800;
    margin:8px 0;
    word-break:break-word;
}

.playlist-header-description{
    color:var(--grey);
    font-size:13px;
    margin-bottom:12px;
}

.playlist-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.green-btn{
    background:var(--green);
    color:#000;
    border-radius:20px;
    padding:9px 16px;
    font-size:12px;
    font-weight:700;
}

.dark-btn{
    background:#282828;
    color:#fff;
    border-radius:20px;
    padding:9px 16px;
    font-size:12px;
    font-weight:700;
}

.danger-btn{
    background:#321414;
    color:#ff7777;
    border-radius:20px;
    padding:9px 16px;
    font-size:12px;
    font-weight:700;
}

/* =========================================================
   SONGS
========================================================= */

.song-list{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.song{
    min-height:62px;
    padding:8px 10px;
    display:flex;
    align-items:center;
    gap:12px;
    border-radius:7px;
    cursor:pointer;
}

.song:hover{
    background:#282828;
}

.song-cover{
    width:46px;
    height:46px;
    border-radius:6px;
    object-fit:cover;
    background:#282828;
    flex-shrink:0;
}

.song-number{
    width:25px;
    text-align:center;
    color:var(--grey);
    font-size:12px;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-title{
    font-size:13px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    color:var(--grey);
    font-size:11px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-duration{
    color:var(--grey);
    font-size:11px;
}

.song-heart{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.song-heart svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:#b3b3b3;
    stroke-width:2;
}

.song-heart.active svg{
    fill:var(--green);
    stroke:var(--green);
}

/* =========================================================
   PLAYER
========================================================= */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:var(--player);
    z-index:100;
    display:flex;
    align-items:center;
    gap:15px;
    padding:8px 16px;
    background:rgba(18,18,18,.97);
    border-top:1px solid #292929;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.player-left{
    width:24%;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:10px;
}

.player-cover{
    width:52px;
    height:52px;
    border-radius:7px;
    object-fit:cover;
    background:#282828;
    flex-shrink:0;
}

.player-info{
    min-width:0;
}

.player-title{
    font-size:13px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    color:var(--grey);
    font-size:11px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-heart{
    width:30px;
    height:30px;
    margin-left:3px;
    flex-shrink:0;
}

.player-heart svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:#aaa;
    stroke-width:2;
}

.player-heart.active svg{
    fill:var(--green);
    stroke:var(--green);
}

.player-center{
    flex:1;
    max-width:620px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.control{
    width:30px;
    height:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#aaa;
}

.control:hover{
    color:#fff;
}

.control.active{
    color:var(--green);
}

.control svg{
    width:17px;
    height:17px;
    fill:currentColor;
}

.main-play{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

.main-play svg{
    width:19px;
    height:19px;
    fill:#000;
}

.progress{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
}

.progress span{
    width:32px;
    color:#aaa;
    font-size:10px;
    text-align:center;
}

input[type="range"]{
    appearance:none;
    -webkit-appearance:none;
    height:4px;
    border-radius:3px;
    background:#4b4b4b;
    outline:none;
}

input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
}

.progress input{
    flex:1;
}

.player-right{
    width:24%;
    min-width:130px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
}

.volume{
    width:80px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    color:var(--grey);
    text-align:center;
    padding:60px 20px;
    font-size:13px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    :root{
        --sidebar:65px;
        --player:74px;
    }

    .sidebar{
        padding:12px 5px 5px;
    }

    .logo{
        justify-content:center;
        padding:5px 0 18px;
    }

    .logo span{
        display:none;
    }

    .nav-item{
        justify-content:center;
        padding:12px 5px;
    }

    .nav-item span{
        display:none;
    }

    .sidebar-section{
        justify-content:center;
        padding:0 0 8px;
    }

    .sidebar-section span{
        display:none;
    }

    .playlist-sidebar-list{
        display:none;
    }

    .profile{
        justify-content:center;
    }

    .profile-name{
        display:none;
    }

    .profile button{
        display:none;
    }

    .topbar{
        height:58px;
        padding:8px 10px;
    }

    .import-buttons{
        gap:5px;
    }

    .import-btn{
        padding:8px 10px;
        font-size:10px;
    }

    .section{
        padding:8px 14px 110px;
    }

    .playlist-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .playlist-card{
        padding:10px;
    }

    .playlist-header{
        align-items:center;
        flex-direction:column;
        text-align:center;
    }

    .playlist-header-cover{
        width:170px;
        height:170px;
    }

    .playlist-header-title{
        font-size:28px;
    }

    .playlist-actions{
        justify-content:center;
        flex-wrap:wrap;
    }

    .search-container{
        max-width:100%;
    }

    .player{
        padding:6px 8px;
        gap:6px;
    }

    .player-left{
        width:auto;
        min-width:0;
        flex:1;
    }

    .player-cover{
        width:45px;
        height:45px;
    }

    .player-heart{
        display:none;
    }

    .player-center{
        width:auto;
        flex:none;
        max-width:none;
    }

    .player-right{
        display:none;
    }

    .controls{
        gap:1px;
    }

    .controls .control:nth-child(1),
    .controls .control:nth-child(5){
        display:none;
    }

    .main-play{
        width:38px;
        height:38px;
    }

    .progress{
        display:none;
    }

    .song{
        padding:7px 5px;
    }

    .song-number{
        display:none;
    }

    .song-duration{
        display:none;
    }

    /*
        Le nouveau bouton aléatoire automatique
        reste visible sur mobile.
    */

    #auto-random-btn{
        display:flex;
    }
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(430px,100%);
    background:#181818;
    border-radius:14px;
    padding:22px;
    box-shadow:0 20px 60px #000;
}

.modal-box h2{
    font-size:20px;
    margin-bottom:15px;
}

.modal-box p{
    color:#aaa;
    font-size:12px;
    margin-bottom:15px;
}

.modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:18px;
}

.file-label{
    display:block;
    background:#282828;
    border:1px dashed #555;
    border-radius:10px;
    padding:20px;
    text-align:center;
    color:#bbb;
    cursor:pointer;
}

.file-label:hover{
    background:#333;
}

.file-label input{
    display:none;
}

</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                <svg viewBox="0 0 100 100">
                    <path
                        d="M30 30L30 70
                           M40 25L40 75
                           M50 20L50 80
                           M60 25L60 75
                           M70 30L70 70"
                        stroke="#000"
                        stroke-width="8"
                        stroke-linecap="round"/>
                </svg>
            </div>

            <span>Spotity</span>

        </div>

        <ul class="nav-list">

            <li class="nav-item active" data-view="home">

                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 9h3v11h5v-6h4v6h5V9h3z"/>
                </svg>

                <span>Accueil</span>

            </li>

            <li class="nav-item" data-view="library">

                <svg viewBox="0 0 24 24">
                    <path d="M4 3h16v2H4V3zm0 4h16v2H4V7zm0 4h16v2H4v-2zm0 4h10v2H4v-2zm0 4h10v2H4v-2z"/>
                </svg>

                <span>Bibliothèque</span>

            </li>

        </ul>

        <div class="sidebar-section">

            <span>Mes playlists</span>

            <button

/* =========================================================
   INDEXED DB
========================================================= */

function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );

        request.onupgradeneeded = event => {

            const database =
                event.target.result;

            if(
                !database.objectStoreNames.contains(
                    STORE_SONGS
                )
            ){

                database.createObjectStore(
                    STORE_SONGS,
                    {keyPath:"id"}
                );

            }

            if(
                !database.objectStoreNames.contains(
                    STORE_PLAYLISTS
                )
            ){

                database.createObjectStore(
                    STORE_PLAYLISTS,
                    {keyPath:"id"}
                );

            }

        };

        request.onsuccess = event => {

            db =
                event.target.result;

            resolve(db);

        };

        request.onerror = () => {

            reject(
                request.error
            );

        };

    });

}


/* =========================================================
   DB HELPERS
========================================================= */

function dbPut(
    storeName,
    data
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    storeName,
                    "readwrite"
                );

            tx.objectStore(
                storeName
            ).put(data);

            tx.oncomplete =
                () => resolve();

            tx.onerror =
                () => reject(tx.error);

        }
    );

}


function dbGet(
    storeName,
    id
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    storeName,
                    "readonly"
                );

            const request =
                tx.objectStore(
                    storeName
                ).get(id);

            request.onsuccess =
                () => resolve(
                    request.result
                );

            request.onerror =
                () => reject(
                    request.error
                );

        }
    );

}


function dbDelete(
    storeName,
    id
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    storeName,
                    "readwrite"
                );

            tx.objectStore(
                storeName
            ).delete(id);

            tx.oncomplete =
                () => resolve();

            tx.onerror =
                () => reject(
                    tx.error
                );

        }
    );

}


function dbGetAll(
    storeName
){

    return new Promise(

            const tx =

                    "readonly"
                );

            const request =

    );

}

/* =========================================================
   FILE / BLOB -> DATA URL
========================================================= */

function blobToDataURL(blob){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                () => reject(
                    reader.error
                );

            reader.readAsDataURL(
                blob
            );

        }
    );

}


function fileToDataURL(file){

    return blobToDataURL(file);

}


/* =========================================================
   EXTRACTION POCHETTE MP3
========================================================= */

async function extractMP3Cover(file){

    try{

        if(
            !file.type.includes("mpeg") &&
            !file.name
                .toLowerCase()
                .endsWith(".mp3")
        ){

            return null;

        }

        const buffer =
            await file
                .slice(
                    0,
                    5 * 1024 * 1024
                )
                .arrayBuffer();

        const bytes =
            new Uint8Array(
                buffer
            );

        if(
            bytes[0] !== 0x49 ||
            bytes[1] !== 0x44 ||
            bytes[2] !== 0x33
        ){

            return null;

        }

        const version =
            bytes[3];

        const tagSize =
            synchsafe(
                bytes[6],
                bytes[7],
                bytes[8],
                bytes[9]
            );

        let pos = 10;

        const end =
            Math.min(
                10 + tagSize,
                bytes.length
            );

        while(
            pos + 10 < end
        ){

            const frameId =
                String.fromCharCode(
                    bytes[pos],
                    bytes[pos + 1],
                    bytes[pos + 2],
                    bytes[pos + 3]
                );

            if(
                !/^[A-Z0-9]{4}$/.test(
                    frameId
                )
            ){

                break;

            }

            let size;

            if(
                version === 4
            ){

                size =
                    synchsafe(
                        bytes[pos + 4],
                        bytes[pos + 5],
                        bytes[pos + 6],
                        bytes[pos + 7]
                    );

            }else{

                size =
                    bytes[pos + 4] * 16777216 +
                    bytes[pos + 5] * 65536 +
                    bytes[pos + 6] * 256 +
                    bytes[pos + 7];

            }

            const dataStart =
                pos + 10;

            const dataEnd =
                dataStart + size;

            if(
                dataEnd > end
            ){

                break;

            }

            if(
                frameId === "APIC" ||
                frameId === "PIC"
            ){

                const frame =
                    bytes.slice(
                        dataStart,
                        dataEnd
                    );

                const cover =
                    parseAPIC(
                        frame
                    );

                if(cover){

                    return cover;

                }

            }

            pos =
                dataEnd;

        }

    }catch(error){

        console.warn(
            "Impossible de lire la pochette:",
            error
        );

    }

    return null;

}


function synchsafe(
    a,
    b,
    c,
    d
){

    return (
        ((a & 127) << 21) |
        ((b & 127) << 14) |
        ((c & 127) << 7) |
        (d & 127)
    );

}


function parseAPIC(bytes){

    try{

        let p = 0;

        const encoding =
            bytes[p++];

        let mimeEnd = p;

        while(
            mimeEnd < bytes.length &&
            bytes[mimeEnd] !== 0
        ){

            mimeEnd++;

        }

        const mime =
            new TextDecoder(
                "ascii"
            ).decode(
                bytes.slice(
                    p,
                    mimeEnd
                )
            );

        p =
            mimeEnd + 1;

        if(
            p >= bytes.length
        ){

            return null;

        }

        p++;

        if(
            encoding === 0 ||
            encoding === 3
        ){

            while(
                p < bytes.length &&
                bytes[p] !== 0
            ){

                p++;

            }

            p++;

        }else{

            while(
                p + 1 < bytes.length &&
                !(
                    bytes[p] === 0 &&
                    bytes[p + 1] === 0
                )
            ){

                p += 2;

            }

            p += 2;

        }

        if(
            p >= bytes.length
        ){

            return null;

        }

        let dataStart = p;

        for(
            let i = p;
            i < bytes.length - 2;
            i++
        ){

            const jpeg =
                bytes[i] === 0xFF &&
                bytes[i + 1] === 0xD8 &&
                bytes[i + 2] === 0xFF;

            const png =
                bytes[i] === 0x89 &&
                bytes[i + 1] === 0x50 &&
                bytes[i + 2] === 0x4E;

            if(
                jpeg ||
                png
            ){

                dataStart = i;

                break;

            }

        }

        const imageBytes =
            bytes.slice(
                dataStart
            );

        if(
            !imageBytes.length
        ){

            return null;

        }

        let type =
            mime;

        if(
            !type ||
            type === "image/jpg"
        ){

            if(
                imageBytes[0] === 0xFF &&
                imageBytes[1] === 0xD8
            ){

                type =
                    "image/jpeg";

            }

        }

        if(
            imageBytes[0] === 0x89 &&
            imageBytes[1] === 0x50
        ){

            type =
                "image/png";

        }

        const blob =
            new Blob(
                [imageBytes],
                {
                    type:
                        type ||
                        "image/jpeg"
                }
            );

        return blobToDataURL(
            blob
        );

    }catch{

        return null;

    }

}

                            .includes(query)

/* =========================================================
   CONSTRUIRE FILE DE LECTURE
========================================================= */

function buildPlayQueue(
    playlist,
    startIndex
){

    const length =
        playlist.songs.length;

    if(!length){

        playQueue = [];
        queuePosition = -1;

        return;

    }


    if(!shuffle){

        playQueue =
            Array.from(
                {length},
                (_,i) => i
            );

        queuePosition =
            startIndex;

        return;

    }


    const others =
        Array.from(
            {length},
            (_,i) => i
        ).filter(
            i => i !== startIndex
        );


    for(
        let i = others.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            others[i],
            others[j]
        ] =
        [
            others[j],
            others[i]
        ];

    }


    playQueue = [
        startIndex,
        ...others
    ];

    queuePosition = 0;

}


/* =========================================================
   PLAYLIST
========================================================= */

function playPlaylist(id){

    const playlist =
        playlists.find(
            p => p.id === id
        );

    if(
        !playlist ||
        !playlist.songs.length
    ){

        return;

    }


    buildPlayQueue(
        playlist,
        0
    );


    playSong(
        playlist,
        0,
        true
    );

}


/* =========================================================
   MORCEAU ALEATOIRE
========================================================= */

function playRandomSong(){

    if(
        !currentPlaylist ||
        !currentPlaylist.songs.length
    ){

        return;

    }


    const songs =
        currentPlaylist.songs;


    if(
        songs.length === 1
    ){

        playSong(
            currentPlaylist,
            0,
            true
        );

        return;

    }


    let randomIndex;


    do{

        randomIndex =
            Math.floor(
                Math.random() *
                songs.length
            );

    }while(
        randomIndex === currentSongIndex
    );


    buildPlayQueue(
        currentPlaylist,
        randomIndex
    );


    playSong(
        currentPlaylist,
        randomIndex,
        true
    );

}


/* =========================================================
   PRELOAD SUIVANT
========================================================= */

async function preloadNextSong(){

    clearNextPreload();


    if(
        !currentPlaylist ||
        !playQueue.length
    ){

        return;

    }


    if(autoRandom){

        return;

    }


    const nextPosition =
        queuePosition + 1;


    if(
        nextPosition >=
        playQueue.length
    ){

        if(
            repeat !== "all"
        ){

            return;

        }

    }


    const actualPosition =
        nextPosition >= playQueue.length
        ? 0
        : nextPosition;


    const nextIndex =
        playQueue[
            actualPosition
        ];


    const song =
        currentPlaylist.songs[
            nextIndex
        ];


    if(!song){

        return;

    }


    try{

        const stored =
            await dbGet(
                STORE_SONGS,
                song.id
            );

        if(
            !stored ||
            !stored.blob
        ){

            return;

        }


        nextPreloadURL =
            URL.createObjectURL(
                stored.blob
            );

        nextPreloadSongId =
            song.id;


        preloadAudio =
            new Audio();

        preloadAudio.preload =
            "auto";

        preloadAudio.src =
            nextPreloadURL;

        preloadAudio.load();

    }catch(error){

        console.warn(
            "Préchargement impossible:",
            error
        );

    }

}


/* =========================================================
   NETTOYER PRELOAD
========================================================= */

function clearNextPreload(){

    if(
        preloadAudio
    ){

        try{

            preloadAudio.pause();

        }catch{}

        preloadAudio.src = "";

        preloadAudio =
            null;

    }


    if(
        nextPreloadURL
    ){

        URL.revokeObjectURL(
            nextPreloadURL
        );

        nextPreloadURL =
            null;

    }


    nextPreloadSongId =
        null;

}


/* =========================================================
   JOUER MUSIQUE
========================================================= */

async function playSong(
    playlist,
    index,
    rebuildQueue = true
){

    if(
        !playlist ||
        !playlist.songs[index]
    ){

        return;

    }


    currentPlaylist =
        playlist;


    if(
        rebuildQueue ||
        !playQueue.length
    ){

        buildPlayQueue(
            playlist,
            index
        );

    }else{

        queuePosition =
            playQueue.indexOf(
                index
            );

    }


    currentSongIndex =
        index;


    const song =
        playlist.songs[
            index
        ];


    try{

        const stored =
            await dbGet(
                STORE_SONGS,
                song.id
            );


        if(
            !stored ||
            !stored.blob
        ){

            alert(
                "Le fichier audio n'est plus disponible. Réimporte cette musique."
            );

            return;

        }


        clearNextPreload();


        if(
            currentObjectURL
        ){

            URL.revokeObjectURL(
                currentObjectURL
            );

            currentObjectURL =
                null;

        }


        currentObjectURL =
            URL.createObjectURL(
                stored.blob
            );


        audio.src =
            currentObjectURL;

        audio.preload =
            "auto";

        audio.load();


        updatePlayer(
            song
        );


        setupMediaSession(
            song
        );


        try{

            await audio.play();

        }catch(error){

            console.warn(
                "Lecture automatique bloquée:",
                error
            );

        }


        preloadNextSong();

    }catch(error){

        console.error(
            error
        );

        alert(
            "Impossible de lire cette musique."
        );

    }

}

   PLAY / PAUSE
========================================================= */

function togglePlay(){

    if(
        !audio.src
    ){

        if(
            playlists.length

            playPlaylist(
                playlists[0].id
            );

        }

        return;

    }


    if(
        audio.paused
    ){

        audio
            .play()
            .catch(

            );

    }else{

        audio.pause();

    }

}

        ){

        }

    }
);


audio.addEventListener(

/* =========================================================
   NEXT
========================================================= */

function nextSong(){

    if(
        !currentPlaylist ||
        !currentPlaylist.songs.length
    ){

        return;

    }


    if(autoRandom){

        playRandomSong();

        return;

    }


    if(
        !playQueue.length
    ){

        buildPlayQueue(
            currentPlaylist,
            currentSongIndex
        );

    }


    let nextPosition =
        queuePosition + 1;


    if(
        nextPosition >=
        playQueue.length
    ){

        if(
            repeat === "all"
        ){

            nextPosition = 0;

        }else{

            audio.pause();

            return;

        }

    }


    const nextIndex =
        playQueue[
            nextPosition
        ];


    queuePosition =
        nextPosition;


    playSong(
        currentPlaylist,
        nextIndex,
        false
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong(){

    if(
        !currentPlaylist ||
        !currentPlaylist.songs.length
    ){

        return;

    }


    if(
        audio.currentTime > 3
    ){

        audio.currentTime =
            0;

        updateMediaPosition();

        return;

    }


    if(
        !playQueue.length
    ){

        buildPlayQueue(
            currentPlaylist,
            currentSongIndex
        );

    }


    let previousPosition =
        queuePosition - 1;


    if(
        previousPosition < 0
    ){

        if(
            repeat === "all"
        ){

            previousPosition =
                playQueue.length - 1;

        }else{

            previousPosition =
                0;

        }

    }


    const previousIndex =
        playQueue[
            previousPosition
        ];


    queuePosition =
        previousPosition;


    playSong(
        currentPlaylist,
        previousIndex,
        false
    );

}


/* =========================================================
   FIN MUSIQUE
========================================================= */

audio.addEventListener(
    "ended",
    () => {

        if(
            repeat === "one"
        ){

            audio.currentTime =
                0;

            audio
                .play()
                .catch(
                    console.error
                );

            return;

        }


        if(autoRandom){

            playRandomSong();

            return;

        }


        nextSong();

    }
);


/* =========================================================
   MEDIA SESSION
========================================================= */

function setupMediaSession(
    song
){

    if(
        !("mediaSession" in navigator)
    ){

        return;

    }


    try{

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    song.title ||
                    "Sans titre",

                artist:
                    song.artist ||
                    "Artiste inconnu",

                album:
                    currentPlaylist?.name ||
                    "Spotity",

                artwork:[
                    {
                        src:
                            song.cover ||
                            defaultCover(
                                song.title
                            ),

                        sizes:
                            "512x512",

                        type:
                            getImageMimeType(
                                song.cover
                            )
                    }
                ]

            });


        navigator.mediaSession.setActionHandler(
            "play",
            () => {

                audio
                    .play()
                    .catch(
                        console.error
                    );

            }
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => {

                audio.pause();

            }
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => {

                previousSong();

            }
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => {

                nextSong();

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            details => {

                const offset =
                    details.seekOffset ||
                    10;

                audio.currentTime =
                    Math.min(
                        audio.duration || Infinity,
                        audio.currentTime +
                        offset
                    );

                updateMediaPosition();

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            details => {

                const offset =
                    details.seekOffset ||
                    10;

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime -
                        offset
                    );

                updateMediaPosition();

            }
        );


        try{

            navigator.mediaSession.setActionHandler(
                "seekto",
                details => {

                    if(
                        typeof details.seekTime !==
                        "number"
                    ){

                        return;

                    }


                    if(
                        details.fastSeek &&
                        "fastSeek" in audio
                    ){

                        audio.fastSeek(
                            details.seekTime
                        );

                    }else{

                        audio.currentTime =
                            details.seekTime;

                    }


                    updateMediaPosition();

                }
            );

        }catch(error){

            console.warn(
                "seekto non disponible:",
                error
            );

        }


    }catch(error){

        console.warn(
            "Media Session non disponible:",
            error
        );

    }

}


/* =========================================================
   MEDIA POSITION
========================================================= */

function updateMediaPosition(){

    if(
        !("mediaSession" in navigator)
    ){

        return;

    }


    if(
        !isFinite(audio.duration) ||
        audio.duration <= 0
    ){

        return;

    }


    try{

        if(
            "setPositionState" in
            navigator.mediaSession
        ){

            navigator.mediaSession
                .setPositionState({

                    duration:
                        audio.duration,

                    playbackRate:
                        audio.playbackRate || 1,

                    position:
                        Math.min(
                            audio.currentTime,
                            audio.duration
                        )

                });

        }

    }catch{}

}


audio.addEventListener(
    "timeupdate",
    () => {

        updateMediaPosition();

    }
);


audio.addEventListener(
    "ratechange",
    () => {

        updateMediaPosition();

    }
);


/* =========================================================
   TYPE IMAGE
========================================================= */

function getImageMimeType(
    src
){

    if(
        typeof src !== "string"
    ){

        return "image/jpeg";

    }


    if(
        src.startsWith(
            "data:image/png"
        )
    ){

        return "image/png";

    }


    if(
        src.startsWith(
            "data:image/webp"
        )
    ){

        return "image/webp";

    }


    if(
        src.startsWith(
            "data:image/gif"
        )
    ){

        return "image/gif";

    }


    return "image/jpeg";

}


/* =========================================================
   FAVORIS
========================================================= */

function isFavorite(

){

function toggleFavorite(
    id
){

        favorites =
            favorites.filter(
                x => x !== id
            );

    }else{

        favorites.push(
            id
        );

    }


    saveFavorites();

    updateHeart();

    renderCurrentView();

}

/* =========================================================
   IMPORT AUDIO
========================================================= */

function importAudio(){

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";


    input.accept =
        "audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus";


    input.multiple =
        true;


    input.addEventListener(
        "change",
        async event => {

            const files =
                Array.from(
                    event.target.files || []
                );


            if(
                !files.length
            ){

                return;

            }


            let playlist =
                playlists[0];


            if(
                !playlist
            ){

                const name =
                    prompt(
                        "Nom de ta nouvelle playlist :",
                        "Mes musiques"
                    );


                if(
                    !name ||
                    !name.trim()
                ){

                    return;

                }


                playlist = {

                    id:
                        "playlist_" +
                        Date.now(),

                    name:
                        name.trim(),

                    description:
                        "Ma playlist",

                    cover:
                        defaultCover(
                            name
                        ),

                    songs:[]

                };


                playlists.push(
                    playlist
                );


                await savePlaylist(
                    playlist
                );

            }


            let imported =
                0;


            for(
                let i = 0;
                i < files.length;
                i++
            ){

                const file =
                    files[i];


                const lower =
                    file.name.toLowerCase();


                const isAudio =
                    file.type.startsWith(
                        "audio/"
                    ) ||
                    /\.(mp3|m4a|aac|wav|flac|ogg|oga|opus)$/i
                        .test(
                            lower
                        );


                if(
                    !isAudio
                ){

                    continue;

                }


                const id =
                    "song_" +
                    Date.now() +
                    "_" +
                    i +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2);


                let cover =
                    null;


                cover =
                    await extractMP3Cover(
                        file
                    );


                if(
                    !cover
                ){

                    cover =
                        defaultCover(
                            file.name
                                .replace(
                                    /\.[^/.]+$/,
                                    ""
                                )
                        );

                }


                const song = {

                    id:id,

                    title:
                        file.name
                            .replace(
                                /\.[^/.]+$/,
                                ""
                            ),

                    artist:
                        "Fichier local",

                    duration:
                        "0:00",

                    cover:
                        cover,

                    playlistId:
                        playlist.id

                };


                await dbPut(
                    STORE_SONGS,
                    {
                        id:id,
                        blob:file
                    }
                );


                playlist.songs.push(
                    song
                );


                imported++;

            }


            await savePlaylist(
                playlist
            );


            renderCurrentView();


            openPlaylist(
                playlist.id
            );


            if(
                imported === 0
            ){

                alert(
                    "Aucun fichier audio valide n'a été trouvé."
                );

            }

        }
    );


    input.click();

}

/* =========================================================
   DELETE PLAYLIST
========================================================= */

async function deletePlaylist(
    id
){

    const playlist =
        playlists.find(
            p => p.id === id
        );


    if(!playlist){

        return;

    }


    const ok =
        confirm(
            `Supprimer la playlist "${playlist.name}" ?`
        );


    if(!ok){

        return;

    }


    if(
        currentPlaylist &&
        currentPlaylist.id === id
    ){

        audio.pause();

        clearNextPreload();

        if(
            currentObjectURL
        ){

            URL.revokeObjectURL(
                currentObjectURL
            );

            currentObjectURL =
                null;

        }

        audio.removeAttribute(
            "src"
        );

        audio.load();

    }


    for(
        const song of playlist.songs
    ){

        await dbDelete(
            STORE_SONGS,
            song.id
        );

    }


    await dbDelete(
        STORE_PLAYLISTS,
        playlist.id
    );


    playlists =
        playlists.filter(
            p =>
                p.id !== id
        );


    currentPlaylist =
        null;

    currentSongIndex =
        -1;

    playQueue =
        [];

    queuePosition =
        -1;


    renderPlaylists();


    document
        .querySelectorAll(
            ".view"
        )
        .forEach(
            v =>
                v.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(
            "home-view"
        )
        .classList.add(
            "active"
        );


    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            n =>
                n.classList.remove(
                    "active"
                )
        );


    document
        .querySelector(
            '.nav-item[data-view="home"]'
        )
        .classList.add(
            "active"
        );

}

/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    seconds
){

    if(
        !isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }


    const min =
        Math.floor(
            seconds / 60
        );


    const sec =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return `${min}:${sec}`;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    str
){

    return String(
        str || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
