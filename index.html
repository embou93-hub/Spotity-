<!DOCTYPE html
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotity - Lecteur de Musique</title>
  <meta name="theme-color" content="#121212">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Manifest PWA Dynamique -->
  <script>
    const manifestData = {
      "name": "Spotity",
      "short_name": "Spotity",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#000000",
      "theme_color": "#1DB954",
      "icons": [{
        "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231DB954'/><path d='M25 40 Q50 30 75 40 M30 52 Q50 44 70 52 M35 64 Q50 58 65 64' stroke='%23000000' stroke-width='6' stroke-linecap='round' fill='none'/></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
      overflow: hidden;
    }

    /* Sidebar - Desktop */
    .sidebar {
      width: 240px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    .nav-group {
      background-color: #121212;
      border-radius: 8px;
      padding: 12px 16px;
    }

    .logo {
      color: #1DB954;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b3b3b3;
      text-decoration: none;
      padding: 10px 0;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: #ffffff;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      background: linear-gradient(to bottom, #222222, #121212 300px);
      border-radius: 8px;
      margin: 8px 8px 8px 0;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }

    /* Top Tags (Fidèle aux captures) */
    .tag-container {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tag {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tag.active {
      background-color: #1DB954;
      color: #000000;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin: 24px 0 16px 0;
    }

    /* Cards Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: #181818;
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      position: relative;
    }

    .card:hover {
      background-color: #282828;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 12px;
      color: #b3b3b3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Lists View (Recherche / Bibliothèque) */
    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px 12px 40px;
      border-radius: 50px;
      border: none;
      background-color: #242424;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 24px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .song-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .song-info img {
      width: 44px;
      height: 44px;
      border-radius: 4px;
    }

    .song-details .title {
      font-size: 14px;
      font-weight: 600;
    }

    .song-details .artist {
      font-size: 12px;
      color: #b3b3b3;
    }

    .song-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-export {
      background-color: #282828;
      color: #fff;
      border: 1px solid #b3b3b3;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-export:hover {
      border-color: #fff;
      scale: 1.02;
    }

    /* Player Controls */
    .player {
      height: 90px;
      background-color: #000000;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 25%;
    }

    .now-playing img {
      width: 56px;
      height: 56px;
      border-radius: 4px;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .control-btn {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      font-size: 14px;
    }

    .control-btn:hover, .control-btn.active {
      color: #ffffff;
    }

    .play-btn {
      width: 32px;
      height: 32px;
      background-color: #ffffff;
      color: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #b3b3b3;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: #4d4d4d;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background-color: #ffffff;
      border-radius: 2px;
      width: 0%;
    }

    .progress-bar:hover .progress-fill {
      background-color: #1DB954;
    }

    .extra-controls {
      width: 25%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .volume-bar {
      width: 100px;
      height: 4px;
      background-color: #4d4d4d;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .volume-fill {
      height: 100%;
      background-color: #ffffff;
      width: 70%;
      border-radius: 2px;
    }

    /* Mobile Navigation Bar */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8));
      backdrop-filter: blur(10px);
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #b3b3b3;
      font-size: 10px;
      text-decoration: none;
    }

    .mobile-nav-item.active {
      color: #ffffff;
    }

    .mobile-nav-item i {
      font-size: 18px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .main-content {
        margin: 0;
        border-radius: 0;
        padding-bottom: 140px;
      }
      .app-container {
        height: calc(100vh - 120px);
      }
      .player {
        position: fixed;
        bottom: 60px;
        left: 0;
        right: 0;
        height: 60px;
        background-color: #121212;
        border-radius: 6px;
        margin: 0 8px;
        padding: 0 8px;
      }
      .mobile-nav {
        display: flex;
      }
      .extra-controls, .progress-container span {
        display: none;
      }
      .player-controls {
        width: auto;
      }
      .now-playing {
        width: 60%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Desktop -->
    <div class="sidebar">
      <div class="nav-group">
        <div class="logo"><i class="fa-brands fa-spotify"></i> Spotity</div>
        <a class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> Accueil</a>
        <a class="nav-item" onclick="switchTab('search')"><i class="fa-solid fa-magnifying-glass"></i> Recherche</a>
      </div>
      <div class="nav-group" style="flex:1;">
        <a class="nav-item" onclick="switchTab('library')"><i class="fa-solid fa-book"></i> Bibliothèque</a>
      </div>
    </div>

    <!-- zone principale -->
    <div class="main-content" id="mainContent">
      <!-- Injecté dynamiquement en JS -->
    </div>
  </div>

  <!-- Lecteur Audio -->
  <div class="player">
    <div class="now-playing">
      <img id="playerImg" src="https://picsum.photos/200?random=1" alt="Cover">
      <div>
        <div class="title" id="playerTitle" style="font-size:14px; font-weight:600;">Piste non sélectionnée</div>
        <div class="artist" id="playerArtist" style="font-size:12px; color:#b3b3b3;">-</div>
      </div>
      <i class="fa-regular fa-heart" id="playerLike" style="margin-left: 12px; cursor: pointer;" onclick="toggleLikeCurrent()"></i>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
        <button class="control-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <button class="control-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
        <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()"><i class="fa-solid fa-repeat"></i></button>
      </div>
      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="seek(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="extra-controls">
      <i class="fa-solid fa-volume-high" style="color: #b3b3b3;"></i>
      <div class="volume-bar" onclick="setVolume(event)">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </div>
  </div>

  <!-- Barre de navigation mobile (Style Captures) -->
  <nav class="mobile-nav">
    <a class="mobile-nav-item active" onclick="switchTab('home')">
      <i class="fa-solid fa-house"></i>
      <span>Accueil</span>
    </a>
    <a class="mobile-nav-item" onclick="switchTab('search')">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Recherche</span>
    </a>
    <a class="mobile-nav-item" onclick="switchTab('library')">
      <i class="fa-solid fa-book"></i>
      <span>Bibliothèque</span>
    </a>
  </nav>

  <!-- Element audio HTML5 -->
  <audio id="audioPlayer"></audio>

  <script>
    // Data Musiques & Playlists
    const songsData = [
      { id: 1, title: "SoundHelix Song 1", artist: "SoundHelix", genre: "Pop", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", cover: "https://picsum.photos/200?random=10" },
      { id: 2, title: "SoundHelix Song 2", artist: "SoundHelix", genre: "Rock", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", cover: "https://picsum.photos/200?random=11" },
      { id: 3, title: "SoundHelix Song 3", artist: "SoundHelix", genre: "Chill", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", cover: "https://picsum.photos/200?random=12" },
      { id: 4, title: "SoundHelix Song 4", artist: "SoundHelix", genre: "Jazz", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", cover: "https://picsum.photos/200?random=13" },
      { id: 5, title: "SoundHelix Song 5", artist: "SoundHelix", genre: "Hip-Hop", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", cover: "https://picsum.photos/200?random=14" }
    ];

    let currentSongIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;
    let likedSongIds = new Set();
    const audio = document.getElementById('audioPlayer');

    // Navigation de pages
    function switchTab(tab) {
      const main = document.getElementById('mainContent');
      
      // Update active nav styling
      document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(el => el.classList.remove('active'));
      
      if (tab === 'home') {
        renderHome();
      } else if (tab === 'search') {
        renderSearch();
      } else if (tab === 'library') {
        renderLibrary();
      }
    }

    // Page Accueil
    function renderHome() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="tag-container">
          <div class="tag active">Tout</div>
          <div class="tag">Musique</div>
          <div class="tag">Podcasts</div>
          <div class="tag">Livres audio</div>
        </div>

        <div class="section-title">Radios recommandées</div>
        <div class="grid-container">
          ${songsData.map((song, i) => `
            <div class="card" onclick="playSong(${i})">
              <img src="${song.cover}" alt="Cover">
              <div class="card-title">${song.title}</div>
              <div class="card-subtitle">${song.artist} • ${song.genre}</div>
            </div>
          `).join('')}
        </div>

        <div class="section-title">Vos mix préférés</div>
        <div class="grid-container">
          <div class="card" onclick="playSong(0)">
            <img src="https://picsum.photos/200?random=20" alt="Cover">
            <div class="card-title">Mix Rap Français</div>
            <div class="card-subtitle">Jul, Ninho, Booba et plus</div>
          </div>
          <div class="card" onclick="playSong(1)">
            <img src="https://picsum.photos/200?random=21" alt="Cover">
            <div class="card-title">Mix Pop</div>
            <div class="card-subtitle">Titres du moment</div>
          </div>
        </div>
      `;
    }

    // Page Recherche
    function renderSearch() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div style="position:relative;">
          <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:14px; top:14px; color:#b3b3b3;"></i>
          <input type="text" class="search-input" id="searchInput" placeholder="Que souhaitez-vous écouter ?" oninput="filterSongs()">
        </div>
        <div class="section-title">Résultats</div>
        <div class="song-list" id="searchResults">
          ${renderSongItems(songsData)}
        </div>
      `;
    }

    function filterSongs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = songsData.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));
      document.getElementById('searchResults').innerHTML = renderSongItems(filtered);
    }

    // Page Bibliothèque
    function renderLibrary() {
      const main = document.getElementById('mainContent');
      const likedSongs = songsData.filter(s => likedSongIds.has(s.id));
      
      main.innerHTML = `
        <div class="section-title">Ma Bibliothèque</div>
        <button class="btn-export" onclick="exportPlaylistToM3U()">
          <i class="fa-solid fa-download"></i> Exporter la Playlist pour Apple Music (.m3u)
        </button>
        
        <div class="section-title" style="font-size: 16px;">Titres Likés (${likedSongs.length})</div>
        <div class="song-list">
          ${likedSongs.length > 0 ? renderSongItems(likedSongs) : '<p style="color:#b3b3b3;">Aucun titre liké pour le moment.</p>'}
        </div>
      `;
    }

    function renderSongItems(list) {
      return list.map(song => {
        const originalIndex = songsData.findIndex(s => s.id === song.id);
        const isLiked = likedSongIds.has(song.id);
        return `
          <div class="song-item" onclick="playSong(${originalIndex})">
            <div class="song-info">
              <img src="${song.cover}" alt="Cover">
              <div class="song-details">
                <div class="title">${song.title}</div>
                <div class="artist">${song.artist}</div>
              </div>
            </div>
            <div class="song-actions" onclick="event.stopPropagation()">
              <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart" 
                 style="color: ${isLiked ? '#1DB954' : '#ffffff'}; cursor:pointer;" 
                 onclick="toggleLike(${song.id})"></i>
            </div>
          </div>
        `;
      }).join('');
    }

    // Fonctions Lecteur Audio
    function loadSong(index) {
      currentSongIndex = index;
      const song = songsData[currentSongIndex];
      audio.src = song.url;
      document.getElementById('playerTitle').innerText = song.title;
      document.getElementById('playerArtist').innerText = song.artist;
      document.getElementById('playerImg').src = song.cover;
      
      updateLikeIcon();
    }

    function playSong(index) {
      loadSong(index);
      audio.play();
      isPlaying = true;
      updatePlayButton();
    }

    function togglePlay() {
      if (!audio.src) loadSong(0);
      
      if (isPlaying) {
        audio.pause();
      } else {
        audio.play();
      }
      isPlaying = !isPlaying;
      updatePlayButton();
    }

    function updatePlayButton() {
      const btn = document.getElementById('playBtn');
      btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
    }

    function prevSong() {
      currentSongIndex = (currentSongIndex - 1 + songsData.length) % songsData.length;
      playSong(currentSongIndex);
    }

    function nextSong() {
      if (isShuffle) {
        currentSongIndex = Math.floor(Math.random() * songsData.length);
      } else {
        currentSongIndex = (currentSongIndex + 1) % songsData.length;
      }
      playSong(currentSongIndex);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
    }

    // Progression
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
        document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
        document.getElementById('duration').innerText = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.play();
      } else {
        nextSong();
      }
    });

    function seek(e) {
      const width = e.target.clientWidth;
      const clickX = e.offsetX;
      audio.currentTime = (clickX / width) * audio.duration;
    }

    function setVolume(e) {
      const width = e.target.clientWidth;
      const clickX = e.offsetX;
      const volume = clickX / width;
      audio.volume = volume;
      document.getElementById('volumeFill').style.width = `${volume * 100}%`;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Gestion des Favoris
    function toggleLike(id) {
      if (likedSongIds.has(id)) {
        likedSongIds.delete(id);
      } else {
        likedSongIds.add(id);
      }
      updateLikeIcon();
      
      // Re-render si on est sur les vues concernées
      if (document.getElementById('searchInput')) filterSongs();
      if (document.querySelector('.section-title').innerText.includes('Bibliothèque')) renderLibrary();
    }

    function toggleLikeCurrent() {
      const currentSong = songsData[currentSongIndex];
      if (currentSong) toggleLike(currentSong.id);
    }

    function updateLikeIcon() {
      const currentSong = songsData[currentSongIndex];
      const likeIcon = document.getElementById('playerLike');
      if (currentSong && likedSongIds.has(currentSong.id)) {
        likeIcon.className = 'fa-solid fa-heart';
        likeIcon.style.color = '#1DB954';
      } else {
        likeIcon.className = 'fa-regular fa-heart';
        likeIcon.style.color = '#ffffff';
      }
    }

    // Exportation Playlist au format Apple Music (.m3u)
    function exportPlaylistToM3U() {
      let m3uContent = "#EXTM3U\n";
      songsData.forEach(song => {
        m3uContent += `#EXTINF:-1,${song.artist} - ${song.title}\n`;
        m3uContent += `${song.url}\n`;
      });

      const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'spotity-playlist.m3u';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Service Worker PWA (Inline Blob)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    // Initialisation
    renderHome();
    loadSong(0);
  </script>
</body>
</html>
