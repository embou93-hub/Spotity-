<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Spotity - Web Player</title>

<style>
:root{
    --black:#000;
    --dark:#121212;
    --medium:#181818;
    --light:#282828;
    --white:#fff;
    --grey:#b3b3b3;
    --green:#1DB954;
    --green-hover:#1ed760;
    --sidebar:240px;
    --player:80px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button{
    border:0;
    background:none;
    color:inherit;
    font:inherit;
    cursor:pointer;
}

img{
    display:block;
    max-width:100%;
}

.app{
    height:calc(100% - var(--player));
    display:flex;
    overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:var(--sidebar);
    background:#000;
    padding:20px 10px 0;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px 20px;
    font-size:22px;
    font-weight:700;
}

.logo-icon{
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--green);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:900;
}

.nav-list{
    list-style:none;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:8px;
    color:var(--grey);
    font-size:13px;
    font-weight:500;
    margin-bottom:2px;
}

.nav-item:hover,
.nav-item.active{
    background:#181818;
    color:#fff;
}

.nav-item svg{
    width:20px;
    height:20px;
    fill:currentColor;
}

.sidebar-title{
    padding:18px 12px 8px;
    color:var(--grey);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.add-playlist{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#181818;
    font-size:20px;
}

.playlist-sidebar-list{
    list-style:none;
    overflow-y:auto;
    flex:1;
    min-height:0;
}

.playlist-sidebar-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border-radius:8px;
    color:var(--grey);
    font-size:13px;
}

.playlist-sidebar-item:hover,
.playlist-sidebar-item.active{
    background:#181818;
    color:#fff;
}

.playlist-sidebar-item img{
    width:32px;
    height:32px;
    border-radius:6px;
    object-fit:cover;
}

.profile{
    padding:12px;
    border-top:1px solid #222;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
}

.profile button{
    margin-left:auto;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-width:0;
    overflow-y:auto;
    background:linear-gradient(to bottom,#1b1b1b,#121212 350px);
}

.top-bar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    justify-content:flex-end;
    padding:12px 24px;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.import-button{
    background:#282828;
    color:#fff;
    padding:9px 14px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    margin-left:8px;
}

.import-button:hover{
    background:#3a3a3a;
}

.section{
    padding:24px;
}

.section h2{
    font-size:22px;
    margin-bottom:5px;
}

.subtitle{
    color:var(--grey);
    font-size:12px;
    margin-bottom:20px;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

/* ================= PLAYLISTS ================= */

.playlist-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:16px;
}

.playlist-card{
    background:var(--medium);
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.playlist-card:hover{
    background:var(--light);
    transform:translateY(-2px);
}

.playlist-card img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:10px;
}

.playlist-card h3{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playlist-card p{
    font-size:11px;
    color:var(--grey);
    margin-top:4px;
}

.card-play{
    position:absolute;
    right:14px;
    bottom:58px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--green);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    box-shadow:0 4px 12px #0008;
}

.delete-playlist{
    margin-top:8px;
    color:#ff6b61;
    font-size:11px;
}

/* ================= SONGS ================= */

.song-list{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.song{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
}

.song:hover{
    background:#282828;
}

.song img{
    width:46px;
    height:46px;
    border-radius:6px;
    object-fit:cover;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-title{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    font-size:11px;
    color:var(--grey);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song button{
    padding:7px;
}

.heart{
    color:var(--grey);
}

.heart.active{
    color:var(--green);
}

.duration{
    font-size:11px;
    color:var(--grey);
    min-width:35px;
    text-align:right;
}

/* ================= PLAYER ================= */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:var(--player);
    background:rgba(18,18,18,.97);
    border-top:1px solid #222;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:15px;
    z-index:999;
}

.player-left{
    width:24%;
    min-width:160px;
    display:flex;
    align-items:center;
    gap:10px;
}

.player-left img{
    width:48px;
    height:48px;
    border-radius:7px;
    object-fit:cover;
}

.player-info{
    min-width:0;
}

.player-title{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    font-size:11px;
    color:var(--grey);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-center{
    flex:1;
    max-width:620px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.controls{
    display:flex;
    align-items:center;
    gap:12px;
}

.control{
    width:28px;
    height:28px;
    color:var(--grey);
}

.control:hover{
    color:#fff;
}

.control.active{
    color:var(--green);
}

.play-main{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--green);
    color:#000;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.play-main:hover{
    background:var(--green-hover);
}

.progress{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    color:var(--grey);
}

input[type="range"]{
    accent-color:var(--green);
    width:100%;
}

.player-right{
    width:24%;
    min-width:130px;
    display:flex;
    justify-content:flex-end;
}

.volume{
    width:90px;
}

.hidden{
    display:none!important;
}

.empty{
    color:var(--grey);
    padding:20px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    :root{
        --player:72px;
    }

    .app{
        height:calc(100% - var(--player));
    }

    .sidebar{
        width:62px;
        padding:12px 5px 0;
    }

    .logo{
        justify-content:center;
        padding:0 0 15px;
    }

    .logo span,
    .nav-item span,
    .sidebar-title,
    .playlist-sidebar-list,
    .profile span{
        display:none;
    }

    .nav-item{
        justify-content:center;
        padding:11px;
    }

    .profile{
        justify-content:center;
        padding:10px;
    }

    .profile button{
        display:none;
    }

    .top-bar{
        padding:9px 10px;
    }

    .import-button{
        font-size:10px;
        padding:8px 10px;
    }

    .section{
        padding:18px 12px;
    }

    .playlist-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .playlist-card{
        padding:10px;
    }

    .player{
        padding:0 8px;
        gap:7px;
    }

    .player-left{
        width:34%;
        min-width:0;
    }

    .player-left img{
        width:40px;
        height:40px;
    }

    .player-left .heart{
        display:none;
    }

    .player-center{
        max-width:none;
    }

    .player-right{
        width:auto;
        min-width:0;
    }

    .volume{
        width:45px;
    }

    .control:first-child,
    .control:last-child{
        display:none;
    }

    .song{
        padding:7px 3px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">♫</div>
        <span>Spotity</span>
    </div>

    <ul class="nav-list">

        <li class="nav-item active" data-view="home">

            <svg viewBox="0 0 24 24">
                <path d="M12 2 2 9h3v11h5v-6h4v6h5V9h3z"/>
            </svg>

            <span>Accueil</span>

        </li>

        <li class="nav-item" data-view="library">

            <svg viewBox="0 0 24 24">
                <path d="M4 2h16v2H4zm0 4h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h10v2H4z"/>
            </svg>

            <span>Bibliothèque</span>

        </li>

    </ul>

    <div class="sidebar-title">

        <span>Mes playlists</span>

        <button
            class="add-playlist"
            id="addPlaylist"
            title="Ajouter une playlist">
            +
        </button>

    </div>

    <ul
        class="playlist-sidebar-list"
        id="sidebarPlaylists">
    </ul>

    <div class="profile">

        <span id="profileName">
            Utilisateur
        </span>

        <button id="renameProfile">
            ✎
        </button>

    </div>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="top-bar">

        <button
            class="import-button"
            id="importAudioButton">

            ＋ Importer des musiques

        </button>

        <button
            class="import-button"
            id="importM3UButton">

            ＋ Importer M3U

        </button>

        <!--
            IMPORTANT :
            multiple permet de sélectionner plusieurs fichiers.
            On accepte également les extensions directement car
            iOS peut parfois fournir un MIME vide ou incorrect.
        -->

        <input
            id="audioFileInput"
            class="hidden"
            type="file"
            multiple
            accept="audio/*,.mp3,.m4a,.mp4,.aac,.wav,.flac,.ogg,.oga,.opus,.webm,.aiff,.aif">

        <input
            id="m3uFileInput"
            class="hidden"
            type="file"
            accept=".m3u,.m3u8,audio/x-mpegurl">

    </div>


    <!-- ================= HOME ================= -->

    <section
        class="view active"
        id="home">

        <div class="section">

            <h2>
                Mes playlists
            </h2>

            <div class="subtitle">
                Uniquement les playlists que vous avez créées.
            </div>

            <div
                class="playlist-grid"
                id="playlistGrid">
            </div>

        </div>

    </section>


    <!-- ================= LIBRARY ================= -->

    <section
        class="view"
        id="library">

        <div class="section">

            <h2>
                Vos titres aimés
            </h2>

            <div class="subtitle">
                Toutes vos chansons favorites.
            </div>

            <div
                class="song-list"
                id="favoriteSongs">
            </div>

        </div>

    </section>


    <!-- ================= PLAYLIST ================= -->

    <section
        class="view"
        id="playlistView">

    </section>

</main>

</div>


<!-- ================= PLAYER ================= -->

<footer class="player">

    <div class="player-left">

        <img
            id="playerCover"
            src=""
            alt="Pochette">

        <div class="player-info">

            <div
                class="player-title"
                id="playerTitle">

                Aucune chanson

            </div>

            <div
                class="player-artist"
                id="playerArtist">

                Spotity

            </div>

        </div>

        <button
            class="heart"
            id="playerFavorite">

            ♡

        </button>

    </div>


    <div class="player-center">

        <div class="controls">

            <button
                class="control"
                id="shuffleButton">

                🔀

            </button>

            <button
                class="control"
                id="previousButton">

                ⏮

            </button>

            <button
                class="play-main"
                id="playButton">

                ▶

            </button>

            <button
                class="control"
                id="nextButton">

                ⏭

            </button>

            <button
                class="control"
                id="repeatButton">

                🔁

            </button>

        </div>

        <div class="progress">

            <span id="currentTime">
                0:00
            </span>

            <input
                id="progressBar"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1">

            <span id="totalTime">
                0:00
            </span>

        </div>

    </div>


    <div class="player-right">

        <input
            class="volume"
            id="volumeBar"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7">

    </div>

</footer>


<!-- AUDIO -->

<audio
    id="audioElement"
    preload="metadata">
</audio>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const PLAYLIST_STORAGE =
    "spotity_playlists_v4";

const FAVORITES_STORAGE =
    "spotity_favorites_v4";

const PROFILE_STORAGE =
    "spotity_profile_v4";

const DB_NAME =
    "spotity_audio_database";

const DB_VERSION =
    1;

const DB_STORE =
    "audioFiles";


/* =========================================================
   VARIABLES
========================================================= */

let playlists =
    JSON.parse(
        localStorage.getItem(PLAYLIST_STORAGE) || "[]"
    );

let favorites =
    JSON.parse(
        localStorage.getItem(FAVORITES_STORAGE) || "[]"
    );

let profile =
    JSON.parse(
        localStorage.getItem(PROFILE_STORAGE) ||
        '{"name":"Utilisateur"}'
    );

let currentPlaylist = null;

let currentSongIndex = -1;

let isPlaying = false;

let shuffleMode = false;

let repeatMode = "off";

let temporaryObjectURLs = [];


const audio =
    document.getElementById("audioElement");


/* =========================================================
   UTILITAIRES
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatTime(seconds){

    if(
        !isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60);

    return (
        minutes +
        ":" +
        String(secondsPart).padStart(2,"0")
    );

}


/* =========================================================
   COVER
========================================================= */

function generateCover(
    title,
    color1="#1DB954",
    color2="#121212"
){

    const safeTitle =
        String(title)
        .replace(/[<>&"]/g,"");

    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 300 300">

            <defs>

                <linearGradient
                    id="gradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

                    <stop
                        offset="0%"
                        stop-color="${color1}"/>

                    <stop
                        offset="100%"
                        stop-color="${color2}"/>

                </linearGradient>

            </defs>

            <rect
                width="300"
                height="300"
                fill="url(#gradient)"/>

            <text
                x="150"
                y="150"
                text-anchor="middle"
                dominant-baseline="middle"
                fill="white"
                font-family="Arial"
                font-size="30"
                font-weight="bold">

                ${safeTitle}

            </text>

        </svg>

    `;

    return (
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg)
    );

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveData(){

    localStorage.setItem(
        PLAYLIST_STORAGE,
        JSON.stringify(playlists)
    );

    localStorage.setItem(
        FAVORITES_STORAGE,
        JSON.stringify(favorites)
    );

}


/* =========================================================
   INDEXED DB
========================================================= */

/*
    Très important :

    On ne sauvegarde PAS les fichiers audio dans
    localStorage.

    On les sauvegarde dans IndexedDB.

    Ainsi les fichiers peuvent être retrouvés
    après fermeture/réouverture de l'application.
*/


function openAudioDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );

            request.onupgradeneeded =
                function(){

                    const database =
                        request.result;

                    if(
                        !database.objectStoreNames.contains(
                            DB_STORE
                        )
                    ){

                        database.createObjectStore(
                            DB_STORE
                        );

                    }

                };

            request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };

            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function saveAudioFile(
    id,
    file
){

    const database =
        await openAudioDatabase();

    return new Promise(
        (resolve,reject)=>{

            const transaction =
                database.transaction(
                    DB_STORE,
                    "readwrite"
                );

            transaction
                .objectStore(DB_STORE)
                .put(file,id);

            transaction.oncomplete =
                resolve;

            transaction.onerror =
                function(){

                    reject(
                        transaction.error
                    );

                };

        }
    );

}


async function getAudioFile(id){

    const database =
        await openAudioDatabase();

    return new Promise(
        (resolve,reject)=>{

            const request =
                database
                .transaction(
                    DB_STORE
                )
                .objectStore(DB_STORE)
                .get(id);

            request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };

            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function deleteAudioFile(id){

    try{

        const database =
            await openAudioDatabase();

        const transaction =
            database.transaction(
                DB_STORE,
                "readwrite"
            );

        transaction
            .objectStore(DB_STORE)
            .delete(id);

    }catch(error){

        console.error(
            "Erreur suppression fichier:",
            error
        );

    }

}


/* =========================================================
   GET SONGS
========================================================= */

function getAllSongs(){

    return playlists.flatMap(
        playlist => playlist.songs
    );

}


function getSongById(id){

    return getAllSongs().find(
        song => song.id === id
    );

}


function getPlaylistById(id){

    return playlists.find(
        playlist => playlist.id === id
    );

}


function isFavorite(id){

    return favorites.includes(id);

}


/* =========================================================
   RENDER PLAYLIST SIDEBAR
========================================================= */

function renderSidebar(){

    const container =
        document.getElementById(
            "sidebarPlaylists"
        );

    if(!playlists.length){

        container.innerHTML =
            `<li class="empty">
                Aucune playlist
            </li>`;

        return;

    }

    container.innerHTML =
        playlists.map(
            playlist => `

                <li
                    class="playlist-sidebar-item"
                    data-playlist-id="${playlist.id}">

                    <img
                        src="${playlist.cover}"
                        alt="">

                    <span>
                        ${escapeHTML(
                            playlist.name
                        )}
                    </span>

                </li>

            `
        ).join("");

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(){

    const grid =
        document.getElementById(
            "playlistGrid"
        );

    if(!playlists.length){

        grid.innerHTML =
            `<p class="empty">
                Aucune playlist pour le moment.
                Importez vos propres musiques.
            </p>`;

        return;

    }

    grid.innerHTML =
        playlists.map(
            playlist => `

                <div
                    class="playlist-card"
                    data-playlist-id="${playlist.id}">

                    <img
                        src="${playlist.cover}"
                        alt="">

                    <h3>
                        ${escapeHTML(
                            playlist.name
                        )}
                    </h3>

                    <p>
                        ${playlist.songs.length}
                        titre(s)

/* =========================================================
   SONG EVENTS
========================================================= */

function bindSongEvents(container){

    container
        .querySelectorAll(
            "[data-song-id]"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    function(event){

                        if(
                            event.target.closest(
                                "[data-favorite-id]"
                            )
                        ){

                            return;

                        }

                        const id =
                            element.dataset.songId;

                        const song =
                            getSongById(id);

                        if(!song){

                            return;

                        }

                        const playlist =
                            getPlaylistById(
                                song.playlistId
                            );

                        if(!playlist){

                            return;

                        }

                        const index =
                            playlist.songs.findIndex(
                                s =>
                                    s.id === id
                            );

                        playSong(
                            playlist,
                            index
                        );

                    }
                );

            }
        );


    container
        .querySelectorAll(
            "[data-favorite-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(event){

                        event.stopPropagation();

                        toggleFavorite(
                            button.dataset.favoriteId
                        );

                    }
                );

            }
        );

}

   FAVORITE TOGGLE
========================================================= */

function toggleFavorite(id){

    if(isFavorite(id)){

        favorites =
            favorites.filter(
                favoriteId =>
                    favoriteId !== id
            );

    }else{

        favorites.push(id);

    }

    saveData();

    renderFavorites();

    renderPlaylistIfOpen();

    updatePlayerFavorite();

}


/* =========================================================
   PLAY SONG
========================================================= */

async function playSong(
    playlist,
    index
){

    if(
        !playlist ||
        !playlist.songs[index]
    ){

        return;

    }

    currentPlaylist =
        playlist;

    currentSongIndex =
        index;

    const song =
        playlist.songs[index];

    updatePlayer();

    let source =
        song.url || null;


    /*
        MUSIQUE LOCALE

        On récupère le fichier depuis
        IndexedDB puis on crée temporairement
        une URL pour l'élément audio.
    */

    if(song.localId){

        try{

            const file =
                await getAudioFile(
                    song.localId
                );

            if(!file){

                alert(
                    "Ce fichier audio n'est plus disponible. Réimportez-le."
                );

                return;

            }

            source =
                URL.createObjectURL(
                    file
                );

            temporaryObjectURLs.push(
                source
            );

        }catch(error){

            console.error(error);

            alert(
                "Impossible d'accéder au fichier audio."
            );

            return;

        }

    }


    if(!source){

        alert(
            "Cette chanson ne possède aucune source audio."
        );

        return;

    }


    audio.src =
        source;

    audio.load();


    try{

        await audio.play();

    }catch(error){

        console.error(
            "Erreur de lecture:",
            error
        );

        isPlaying =
            false;

        updatePlayButton();

    }

}

async function togglePlay(){

    if(!audio.src){

            playlists.length &&
            playlists[0].songs.length
        ){

            await playSong(
                playlists[0],
                0
            );

        }

        return;

    }


    if(audio.paused){

        try{

            await audio.play();

        }catch(error){

            console.error(
                error
            );

        }

    }else{

        audio.pause();

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextSong(){

    if(
        !currentPlaylist ||
        !currentPlaylist.songs.length
    ){

        return;

    }


    let nextIndex;


    if(shuffleMode){

        if(
            currentPlaylist.songs.length === 1
        ){

            nextIndex = 0;

        }else{

            do{

                nextIndex =
                    Math.floor(
                        Math.random() *
                        currentPlaylist.songs.length
                    );

            }while(
                nextIndex ===
                currentSongIndex
            );

        }

    }else{

        nextIndex =
            currentSongIndex + 1;

    }


    if(
        nextIndex >=
        currentPlaylist.songs.length
    ){

        if(repeatMode === "all"){

            nextIndex = 0;

        }else{

            isPlaying = false;

            updatePlayButton();

            return;

        }

    }


    playSong(
        currentPlaylist,
        nextIndex
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong(){

    if(!currentPlaylist){

        return;

    }


    if(audio.currentTime > 3){

        audio.currentTime = 0;

        return;

    }


    let previousIndex =
        currentSongIndex - 1;


    if(previousIndex < 0){

        if(repeatMode === "all"){

            previousIndex =
                currentPlaylist.songs.length - 1;

        }else{

            previousIndex = 0;

        }

    }


    playSong(
        currentPlaylist,
        previousIndex
    );

}

/* =========================================================
   IMPORT AUDIO - VERSION CORRIGÉE
========================================================= */

document.getElementById(
    "audioFileInput"
).addEventListener(
    "change",
    async function(event){

        /*
            On récupère TOUS les fichiers.
        */

        const selectedFiles =
            Array.from(
                event.target.files || []
            );


        if(!selectedFiles.length){

            return;

        }


        /*
            IMPORTANT :

            On ne se contente PAS de file.type.

            Sur iPhone/iOS, certains fichiers peuvent
            avoir un MIME vide ou incorrect.

            On vérifie donc également l'extension.
        */

        const allowedExtensions = [

            ".mp3",
            ".m4a",
            ".mp4",
            ".aac",
            ".wav",
            ".flac",
            ".ogg",
            ".oga",
            ".opus",
            ".webm",
            ".aiff",
            ".aif"

        ];


        const validFiles =
            selectedFiles.filter(
                function(file){

                    const filename =
                        file.name.toLowerCase();

                    const extensionOK =
                        allowedExtensions.some(
                            function(extension){

                                return filename.endsWith(
                                    extension
                                );

                            }
                        );

                    const mimeOK =
                        file.type &&
                        file.type.toLowerCase()
                            .startsWith("audio/");


                    return (
                        mimeOK ||
                        extensionOK
                    );

                }
            );


        if(!validFiles.length){

            alert(
                "Aucun fichier audio valide.\n\n" +
                "Formats acceptés : MP3, M4A, MP4, AAC, WAV, FLAC, OGG, OPUS, AIFF."
            );

            event.target.value = "";

            return;

        }


        const playlistName =
            prompt(
                "Nom de la playlist :",
                "Mes musiques"
            );


        if(
            !playlistName ||
            !playlistName.trim()
        ){

            event.target.value = "";

            return;

        }


        const playlistId =
            "playlist_" +
            Date.now();


        const playlist = {

            id:playlistId,

            name:
                playlistName.trim(),

            description:
                "Mes fichiers audio",

            cover:
                generateCover(
                    playlistName.trim(),
                    "#1DB954",
                    "#121212"
                ),

            songs:[]

        };


        /*
            On traite TOUS les fichiers sélectionnés.
        */

        for(
            let i = 0;
            i < validFiles.length;
            i++
        ){

            const file =
                validFiles[i];


            const songId =
                "song_" +
                Date.now() +
                "_" +
                i +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2);


            const localId =
                "local_" +
                songId;


            try{

                /*
                    Sauvegarde permanente du fichier.
                */

                await saveAudioFile(
                    localId,
                    file
                );


                let duration =
                    "0:00";


                /*
                    On essaie de récupérer
                    la vraie durée.
                */

                try{

                    duration =
                        await getAudioDuration(
                            file
                        );

                }catch(error){

                    console.warn(
                        "Durée inconnue:",
                        file.name
                    );

                }


                const title =
                    file.name
                        .replace(
                            /\.[^/.]+$/,
                            ""
                        );


                playlist.songs.push({

                    id:
                        songId,

                    localId:
                        localId,

                    title:
                        title,

                    artist:
                        "Fichier local",

                    duration:
                        duration,

                    cover:
                        generateCover(
                            title,
                            "#0984E3",
                            "#6C5CE7"
                        ),

                    playlistId:
                        playlistId

                });


            }catch(error){

                console.error(
                    "Erreur avec le fichier:",
                    file.name,
                    error
                );

            }

        }


        /*
            Si au moins une musique a réussi,
            on crée la playlist.
        */

        if(
            playlist.songs.length === 0
        ){

            alert(
                "Les fichiers ont été sélectionnés mais aucun n'a pu être enregistré."
            );

            event.target.value = "";

            return;

        }


        playlists.push(
            playlist
        );


        saveData();

        renderAll();

        openPlaylist(
            playlist.id
        );


        alert(
            playlist.songs.length +
            " musique(s) importée(s) avec succès !"
        );


        /*
            Très important :

            Permet de sélectionner à nouveau
            les mêmes fichiers.
        */

        event.target.value = "";

    }
);


/* =========================================================
   GET AUDIO DURATION
========================================================= */

function getAudioDuration(file){

    return new Promise(
        function(resolve,reject){

            const url =
                URL.createObjectURL(
                    file
                );

            const tempAudio =
                document.createElement(
                    "audio"
                );


            tempAudio.preload =
                "metadata";


            tempAudio.onloadedmetadata =
                function(){

                    const duration =
                        formatTime(
                            tempAudio.duration
                        );

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(
                        duration
                    );

                };


            tempAudio.onerror =
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                    reject(
                        new Error(
                            "Durée inconnue"
                        )
                    );

                };


            tempAudio.src =
                url;

        }
    );

}

document.getElementById(
    "m3uFileInput"
).addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        const content =
            await file.text();


        const lines =
            content.split(
                /\r?\n/
            );


        const songs = [];


        let title = null;

        let artist = null;

        let duration = "0:00";


        for(
            const rawLine of lines
        ){

            const line =
                rawLine.trim();


            if(
                line.startsWith(
                    "#EXTINF"
                )
            ){

                const match =
                    line.match(
                        /#EXTINF:\s*(-?\d+)\s*,\s*(.*)/
                    );


                if(match){

                    duration =
                        formatTime(
                            Number(
                                match[1]
                            )
                        );


                    const details =
                        match[2].split(
                            " - "
                        );


                    if(
                        details.length >= 2
                    ){

                        artist =
                            details.shift().trim();

                        title =
                            details.join(
                                " - "
                            ).trim();

                    }else{

                        artist =
                            "Artiste inconnu";

                        title =
                            match[2];

                    }

                }

            }else if(
                /^https?:\/\//i.test(
                    line
                )
            ){

                songs.push({

                    id:
                        "m3u_" +
                        Date.now() +
                        "_" +
                        songs.length,

                    title:
                        title ||
                        "Titre inconnu",

                    artist:
                        artist ||
                        "Artiste inconnu",

                    url:
                        line,

                    duration:
                        duration,

                    cover:
                        generateCover(
                            title ||
                            "Music",
                            "#1DB954",
                            "#121212"
                        )

                });


                title = null;

                artist = null;

                duration = "0:00";

            }

        }


        if(!songs.length){

            alert(
                "Aucune URL audio valide trouvée dans le fichier M3U."
            );

            return;

        }


        const name =
            prompt(
                "Nom de la playlist :",
                file.name.replace(
                    /\.(m3u8?|txt)$/i,
                    ""
                )
            );


        if(!name){

            return;

        }


        const playlistId =
            "m3u_playlist_" +
            Date.now();


        songs.forEach(
            song =>
                song.playlistId =
                    playlistId
        );


        playlists.push({

            id:
                playlistId,

            name:
                name.trim(),

            description:
                "Playlist M3U",

            cover:
                generateCover(
                    name,
                    "#E17055",
                    "#6C5CE7"
                ),

            songs:
                songs

        });


        saveData();

        renderAll();

        openPlaylist(
            playlistId
        );

    }
);


/* =========================================================
   DELETE PLAYLIST
========================================================= */

async function deletePlaylist(id){

    const playlist =
        getPlaylistById(id);


    if(!playlist){

        return;

    }


    const confirmed =
        confirm(
            "Supprimer la playlist « " +
            playlist.name +
            " » ?\n\n" +
            "Les fichiers audio importés seront également supprimés."
        );


    if(!confirmed){

        return;

    }


    /*
        Suppression des vrais fichiers
        enregistrés dans IndexedDB.
    */

    for(
        const song of playlist.songs
    ){

        if(song.localId){

            await deleteAudioFile(
                song.localId
            );

        }

    }


    playlists =
        playlists.filter(
            playlist =>
                playlist.id !== id
        );


    /*
        Nettoyage des favoris.
    */

    const remainingSongIds =
        new Set(
            getAllSongs().map(
                song => song.id
            )
        );


    favorites =
        favorites.filter(
            id =>
                remainingSongIds.has(id)
        );


    saveData();

    currentPlaylist = null;

    currentSongIndex = -1;

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();

    isPlaying = false;

    updatePlayButton();

    updatePlayer();


    document
        .querySelectorAll(".view")
        .forEach(
            view =>
                view.classList.remove(
                    "active"
                )
        );


    document
        .getElementById("home")
        .classList.add(
            "active"
        );


    renderAll();

}

            ){

                playSong(
                    selectedPlaylist,
                    0
                );

            }

            return;

        }


        const card =
            event.target.closest(
                "[data-playlist-id]"
            );


        if(card){

            openPlaylist(
                card.dataset.playlistId
            );

        }

    }
);


/* =========================================================
   SIDEBAR CLICKS
========================================================= */

document.getElementById(
    "sidebarPlaylists"
).addEventListener(
    "click",
    function(event){

        const item =
            event.target.closest(
                "[data-playlist-id]"
            );


        if(item){

            openPlaylist(
                item.dataset.playlistId
            );

        }

    }
);


/* =========================================================
   PLAYLIST DELETE BUTTON
========================================================= */

document.getElementById(
    "playlistView"
).addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "[data-delete-current]"
            );


        if(button){

            deletePlaylist(
                button.dataset
                    .deleteCurrent
            );

        }

    }
);


/* =========================================================
   NAVIGATION
========================================================= */

document
    .querySelectorAll(".nav-item")
    .forEach(
        item => {

            item.addEventListener(
                "click",
                function(){

                    const viewName =
                        item.dataset.view;


                    document
                        .querySelectorAll(".view")
                        .forEach(
                            view =>
                                view.classList.remove(
                                    "active"
                                )
                        );


                    document
                        .getElementById(
                            viewName
                        )
                        .classList.add(
                            "active"
                        );


                    document
                        .querySelectorAll(".nav-item")
                        .forEach(
                            nav =>
                                nav.classList.remove(
                                    "active"
                                )
                        );


                    item.classList.add(
                        "active"
                    );


                    if(
                        viewName ===
                        "library"
                    ){

                        renderFavorites();

                    }

                }
            );

        }
    );


/* =========================================================
   PROFILE
========================================================= */

document.getElementById(
    "renameProfile"
).addEventListener(
    "click",
    function(){

        const name =
            prompt(
                "Votre nom :",
                profile.name
            );


        if(
            name &&
            name.trim()
        ){

            profile.name =
                name.trim();


            localStorage.setItem(
                PROFILE_STORAGE,
                JSON.stringify(
                    profile
                )
            );


            renderProfile();

        }

    }
);


function renderProfile(){

    document.getElementById(
        "profileName"
    ).textContent =
        profile.name ||
        "Utilisateur";

}


/* =========================================================
   RENDER PLAYLIST CURRENT VIEW
========================================================= */

function renderPlaylistIfOpen(){

    if(
        currentPlaylist &&
        document
            .getElementById(
                "playlistView"
            )
            .classList.contains(
                "active"
            )
    ){

        openPlaylist(
            currentPlaylist.id
        );

    }

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderAll(){

    renderProfile();

    renderSidebar();

    renderHome();

    renderFavorites();

}


/* =========================================================
   START APP
========================================================= */

renderAll();

updatePlayer();

updatePlayButton();


/*
    Aucun fichier audio ou playlist
    préinstallé n'est créé ici.

    L'utilisateur commence avec une
    application vide et ajoute uniquement
    ses propres playlists.
*/

</script>

</body>
</html>
