<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Spotity</title>

<style>
:root{
 --black:#000;
 --dark:#121212;
 --medium:#181818;
 --light:#282828;
 --white:#fff;
 --grey:#b3b3b3;
 --green:#1DB954;
 --green2:#1ed760;
 --sidebar:240px;
 --player:82px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
 background:#000;color:#fff;
 user-select:none;
 -webkit-tap-highlight-color:transparent;
}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
img{display:block}
.app{height:100%;display:flex;overflow:hidden}
.sidebar{
 width:var(--sidebar);background:#000;padding:18px 10px 0;
 display:flex;flex-direction:column;flex-shrink:0;z-index:10;
}
.logo{
 padding:0 12px 20px;display:flex;align-items:center;gap:10px;
 font-size:22px;font-weight:700;
}
.logo-icon{
 width:30px;height:30px;border-radius:50%;background:var(--green);
 display:flex;align-items:center;justify-content:center;
}
.logo-icon svg{width:18px;height:18px}
.nav-list{list-style:none;margin-bottom:20px}
.nav-item{
 display:flex;align-items:center;gap:14px;padding:11px 14px;
 color:var(--grey);border-radius:8px;font-size:14px;font-weight:600;
 margin-bottom:2px;
}
.nav-item.active,.nav-item:hover{
 color:#fff;background:rgba(255,255,255,.1)
}
.nav-item svg{width:20px;height:20px;fill:currentColor}
.sidebar-title{
 color:var(--grey);font-size:11px;font-weight:700;
 text-transform:uppercase;letter-spacing:1px;
 padding:0 12px 10px;
 display:flex;justify-content:space-between;align-items:center
}
.add-playlist{
 width:27px;height:27px;border-radius:50%;
 background:#202020;display:flex;align-items:center;justify-content:center
}
.playlists{list-style:none;overflow:auto;flex:1}
.playlist-item{
 display:flex;align-items:center;gap:10px;padding:8px 12px;
 color:var(--grey);border-radius:8px;font-size:13px;cursor:pointer
}
.playlist-item:hover,.playlist-item.active{
 color:#fff;background:rgba(255,255,255,.08)
}
.playlist-item img{
 width:34px;height:34px;border-radius:6px;object-fit:cover
}
.profile{
 padding:12px;border-top:1px solid #222;
 display:flex;align-items:center;gap:10px
}
.profile-name{font-size:13px;font-weight:600;flex:1}
.profile img{width:32px;height:32px;border-radius:50%}

.main{
 flex:1;min-width:0;height:100%;overflow-y:auto;
 background:linear-gradient(#1b1b1b 0,#121212 330px);
 padding-bottom:var(--player)
}
.topbar{
 position:sticky;top:0;z-index:5;
 padding:12px 24px;display:flex;justify-content:flex-end;
 background:rgba(0,0,0,.65);backdrop-filter:blur(12px)
}
.top-buttons{display:flex;gap:8px}
.import-btn{
 padding:9px 14px;border-radius:20px;
 background:#292929;color:#fff;font-size:11px;font-weight:700
}
.import-btn:hover{background:#3a3a3a}
.section{padding:0 24px 40px}
.header{
 display:flex;align-items:center;justify-content:space-between;
 margin:20px 0 14px
}
.title{font-size:22px;font-weight:700}
.subtitle{color:var(--grey);font-size:12px;margin-top:4px}

.playlist-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:16px
}
.playlist-card{
 background:#181818;border-radius:10px;padding:14px;
 cursor:pointer;position:relative;transition:.2s
}
.playlist-card:hover{background:#282828;transform:translateY(-2px)}
.playlist-card>img{
 width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:11px
}
.playlist-card h3{
 font-size:14px;margin-bottom:4px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.playlist-card p{
 color:var(--grey);font-size:11px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.card-play{
 position:absolute;right:15px;bottom:65px;
 width:40px;height:40px;border-radius:50%;background:var(--green);
 color:#000;display:flex;align-items:center;justify-content:center;
 opacity:0;transform:translateY(5px);transition:.2s
}
.playlist-card:hover .card-play{opacity:1;transform:none}
.card-play svg{width:18px;height:18px;fill:currentColor}

.view{display:none}
.view.active{display:block}

.song-list{display:flex;flex-direction:column;gap:2px}
.song{
 display:flex;align-items:center;gap:13px;
 padding:8px 10px;border-radius:8px;cursor:pointer
}
.song:hover{background:#282828}
.song-cover{
 width:48px;height:48px;object-fit:cover;border-radius:6px;
 flex-shrink:0;background:#282828
}
.song-info{min-width:0;flex:1}
.song-title{
 font-size:13px;font-weight:600;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.song-artist{
 color:var(--grey);font-size:11px;margin-top:3px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.song-duration{color:var(--grey);font-size:11px;min-width:38px;text-align:right}
.favorite{
 width:30px;height:30px;display:flex;
 align-items:center;justify-content:center
}
.favorite svg{width:17px;height:17px;fill:none;stroke:#aaa;stroke-width:2}
.favorite.active svg{fill:var(--green);stroke:var(--green)}
.song-play{
 width:31px;height:31px;border-radius:50%;
 background:var(--green);color:#000;
 display:flex;align-items:center;justify-content:center;
 opacity:0
}
.song:hover .song-play{opacity:1}
.song-play svg{width:15px;height:15px;fill:currentColor}

.player{
 position:fixed;left:0;right:0;bottom:0;height:var(--player);
 background:rgba(18,18,18,.97);
 border-top:1px solid #292929;
 display:flex;align-items:center;padding:0 16px;gap:14px;
 z-index:999
}
.player-left{
 width:25%;min-width:180px;
 display:flex;align-items:center;gap:10px
}
.player-cover{
 width:50px;height:50px;border-radius:7px;object-fit:cover
}
.player-info{min-width:0}
.player-title{
 font-size:13px;font-weight:600;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.player-artist{
 color:var(--grey);font-size:11px;margin-top:3px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.player-center{
 flex:1;max-width:620px;margin:auto;
 display:flex;flex-direction:column;align-items:center;gap:6px
}
.controls{display:flex;align-items:center;gap:12px}
.control{
 width:29px;height:29px;display:flex;
 align-items:center;justify-content:center;color:#aaa
}
.control:hover{color:#fff}
.control svg{width:17px;height:17px;fill:currentColor}
.play{
 width:37px;height:37px;border-radius:50%;
 background:var(--green);color:#000;
 display:flex;align-items:center;justify-content:center
}
.play:hover{background:var(--green2);transform:scale(1.04)}
.play svg{width:19px;height:19px;fill:currentColor}
.progress{
 width:100%;display:flex;align-items:center;gap:8px;
 color:#aaa;font-size:10px
}
.range{
 flex:1;height:4px;appearance:none;
 background:#444;border-radius:4px;outline:none
}
.range::-webkit-slider-thumb{
 appearance:none;width:10px;height:10px;border-radius:50%;
 background:#fff
}
.player-right{
 width:25%;min-width:130px;
 display:flex;justify-content:flex-end;align-items:center
}
.volume{width:85px}

.empty{
 color:var(--grey);padding:25px 10px;font-size:13px
}

@media(max-width:768px){
 :root{--sidebar:62px;--player:72px}
 .sidebar{padding:14px 5px 0}
 .logo{justify-content:center;padding:0 0 18px}
 .logo span{display:none}
 .nav-item{justify-content:center;padding:11px 5px}
 .nav-item span{display:none}
 .sidebar-title,.playlists,.profile-name,#btn-logout{display:none}
 .profile{justify-content:center;padding:10px 0}
 .main{padding-bottom:var(--player)}
 .topbar{padding:9px 10px}
 .import-btn{font-size:10px;padding:8px 10px}
 .section{padding:0 12px 30px}
 .playlist-grid{
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px
 }
 .playlist-card{padding:10px}
 .playlist-card h3{font-size:12px}
 .player{padding:0 8px;gap:6px}
 .player-left{width:auto;min-width:0;flex:1}
 .player-cover{width:43px;height:43px}
 .player-center{flex:1.4}
 .player-right{display:none}
 .controls{gap:4px}
 .control{width:25px}
 .progress{gap:5px}
 .song{gap:9px}
 .song-cover{width:44px;height:44px}
}

/* Menu contextuel */
.context-menu{

.context-menu button:hover{background:#3a3a3a}

<script>
/* =========================================================
   SPOTITY
   ========================================================= */

const PLAYLIST_KEY = "spotity_playlists_v5";
const FAVORITES_KEY = "spotity_favorites_v5";
const DB_NAME = "SpotityAudioDB";
const DB_VERSION = 1;
const STORE = "files";

let playlists = [];
let favorites = [];
let currentPlaylist = null;
let currentIndex = -1;
let isPlaying = false;
let shuffle = false;
let repeat = false;
let db = null;
let objectUrls = [];
let contextPlaylistId = null;

const audio = document.getElementById("audio");

/* =========================================================
   INDEXED DB
   ========================================================= */

function openDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded=e=>{
   const database=e.target.result;
   if(!database.objectStoreNames.contains(STORE)){
    database.createObjectStore(STORE);
   }
  };

  request.onsuccess=e=>{
   db=e.target.result;
   resolve(db);
  };

  request.onerror=()=>reject(request.error);
 });
}

function saveFile(id,file){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).put(file,id);
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error);
 });
}

function getFile(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readonly");
  const request=tx.objectStore(STORE).get(id);

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function deleteFile(id){
 return new Promise(resolve=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).delete(id);
  tx.oncomplete=resolve;
 });
}

/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadData(){
 try{
  playlists=JSON.parse(localStorage.getItem(PLAYLIST_KEY)||"[]");
 }catch{
  playlists=[];
 }

 try{
  favorites=JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]");
 }catch{
  favorites=[];
 }
}

function saveData(){
 localStorage.setItem(PLAYLIST_KEY,JSON.stringify(playlists));
 localStorage.setItem(FAVORITES_KEY,JSON.stringify(favorites));
}

/* =========================================================
   COVER GENERATOR
   ========================================================= */

function generatedCover(text,a="#0984E3",b="#6C5CE7"){
 const safe=(text||"♪").replace(/[<>&"]/g,"");
 const svg=`
 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
 <defs>
 <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="${a}"/>
 <stop offset="1" stop-color="${b}"/>
 </linearGradient>
 </defs>
 <rect width="500" height="500" fill="url(#g)"/>
 <circle cx="250" cy="230" r="90" fill="rgba(255,255,255,.12)"/>
 <text x="250" y="245" text-anchor="middle"
 font-family="Arial" font-size="100" fill="white">♫</text>
 <text x="250" y="390" text-anchor="middle"
 font-family="Arial" font-size="28" font-weight="bold"
 fill="white">${safe.substring(0,25)}</text>
 </svg>`;

 return "data:image/svg+xml;charset=utf-8,"+
 encodeURIComponent(svg);
}

/* =========================================================
   MP3 COVER EXTRACTION
   ========================================================= */

async function extractMP3Cover(file){

 try{

  if(!file.name.toLowerCase().endsWith(".mp3")){
   return null;
  }

  const buffer=await file.arrayBuffer();
  const view=new DataView(buffer);

  if(buffer.byteLength<10)return null;

  /* ID3v2 */
  if(
   view.getUint8(0)!==0x49 ||
   view.getUint8(1)!==0x44 ||
   view.getUint8(2)!==0x33
  ){
   return null;
  }

  const version=view.getUint8(3);
  const tagSize=
   ((view.getUint8(6)&0x7f)<<21) |
   ((view.getUint8(7)&0x7f)<<14) |
   ((view.getUint8(8)&0x7f)<<7) |
   (view.getUint8(9)&0x7f);

  let offset=10;
  const end=Math.min(buffer.byteLength,10+tagSize);

  while(offset+10<=end){

   const id=String.fromCharCode(
    view.getUint8(offset),
    view.getUint8(offset+1),
    view.getUint8(offset+2),
    view.getUint8(offset+3)
   );

   let size;

   if(version===4){
    size=
     ((view.getUint8(offset+4)&0x7f)<<21) |
     ((view.getUint8(offset+5)&0x7f)<<14) |
     ((view.getUint8(offset+6)&0x7f)<<7) |
     (view.getUint8(offset+7)&0x7f);
   }else{
    size=view.getUint32(offset+4);
   }

   if(!size)break;

   if(id==="APIC" || id==="PIC"){

    const start=offset+10;
    const bytes=new Uint8Array(buffer,start,size);

    let p=0;

    if(id==="APIC"){

     /* encoding */
     const encoding=bytes[p++];

     /* MIME */
     let mimeStart=p;

     while(p<bytes.length && bytes[p]!==0)p++;

     let mime=new TextDecoder("ascii").decode(
      bytes.slice(mimeStart,p)
     );

     p++;

     /* picture type */
     p++;

     /* description */
     if(encoding===0 || encoding===3){
      while(p<bytes.length && bytes[p]!==0)p++;
      p++;
     }else{
      while(p+1<bytes.length &&
       !(bytes[p]===0 && bytes[p+1]===0)
      )p+=2;
      p+=2;
     }

     const imageBytes=bytes.slice(p);

     if(imageBytes.length){
      const blob=new Blob(
       [imageBytes],
       {type:mime||"image/jpeg"}
      );

      return URL.createObjectURL(blob);
     }
    }
   }

   offset+=10+size;
  }

 }catch(e){
  console.warn("Impossible de récupérer la pochette:",e);
 }

 return null;
}

/* =========================================================
   ID3 TITLE / ARTIST
   ========================================================= */

async function readMP3Metadata(file){

 const result={
  title:file.name.replace(/\.[^/.]+$/,""),
  artist:"Fichier local"
 };

 try{

  if(!file.name.toLowerCase().endsWith(".mp3"))
   return result;

  const buffer=await file.slice(0,1024*1024).arrayBuffer();
  const view=new DataView(buffer);

  if(
   view.byteLength<10 ||
   view.getUint8(0)!==0x49 ||
   view.getUint8(1)!==0x44 ||
   view.getUint8(2)!==0x33
  )return result;

  const version=view.getUint8(3);
  const tagSize=
   ((view.getUint8(6)&127)<<21) |
   ((view.getUint8(7)&127)<<14) |
   ((view.getUint8(8)&127)<<7) |
   (view.getUint8(9)&127);

  let offset=10;

  const decodeText=(bytes,encoding)=>{
   try{
    if(encoding===0)
     return new TextDecoder("iso-8859-1").decode(bytes)
      .replace(/\0/g,"").trim();

    if(encoding===1)
     return new TextDecoder("utf-16").decode(bytes)
      .replace(/\0/g,"").trim();

    if(encoding===2)
     return new TextDecoder("utf-16be").decode(bytes)
      .replace(/\0/g,"").trim();

    return new TextDecoder("utf-8").decode(bytes)
      .replace(/\0/g,"").trim();
   }catch{
    return "";
   }
  };

  while(offset+10<Math.min(view.byteLength,10+tagSize)){

   const id=String.fromCharCode(
    view.getUint8(offset),
    view.getUint8(offset+1),
    view.getUint8(offset+2),
    view.getUint8(offset+3)
   );

   let size;

   if(version===4){
    size=
     ((view.getUint8(offset+4)&127)<<21) |
     ((view.getUint8(offset+5)&127)<<14) |
     ((view.getUint8(offset+6)&127)<<7) |
     (view.getUint8(offset+7)&127);
   }else{
    size=view.getUint32(offset+4);
   }

   if(!size)break;

   if(id==="TIT2" || id==="TT2"){
    const bytes=new Uint8Array(
     buffer,offset+10,size
    );
    const text=decodeText(bytes.slice(1),bytes[0]);
    if(text)result.title=text;
   }

   if(id==="TPE1" || id==="TP1"){
    const bytes=new Uint8Array(
     buffer,offset+10,size
    );
    const text=decodeText(bytes.slice(1),bytes[0]);
    if(text)result.artist=text;
   }

   offset+=10+size;
  }

 }catch(e){
  console.warn("Metadata MP3:",e);
 }

 return result;
}

   HYDRATE FILES
   ========================================================= */

async function restoreFiles(){

 for(const playlist of playlists){

  for(const song of playlist.songs||[]){

   if(song.storageId){

    try{

     const file=await getFile(song.storageId);

     if(file){

      const url=URL.createObjectURL(file);

      song.url=url;
      objectUrls.push(url);

      if(!song.cover || song.coverType==="generated"){
       const cover=await extractMP3Cover(file);

       if(cover){
        song.cover=cover;
        song.coverType="embedded";
       }
      }

     }

    }catch(e){
     console.warn("Fichier introuvable:",song.title);
    }
   }
  }
 }

 renderAll();
}

function formatTime(sec){
 if(!isFinite(sec)||sec<0)return"0:00";
 const m=Math.floor(sec/60);
 const s=Math.floor(sec%60).toString().padStart(2,"0");
 return `${m}:${s}`;
}

function allSongs(){
 return playlists.flatMap(p=>p.songs||[]);
}

function getSong(id){
 return allSongs().find(s=>s.id===id);
}

function isFavorite(id){
 return favorites.includes(id);

function escapeHTML(str){
 return String(str??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

/* =========================================================
   PLAYBACK
   ========================================================= */

function playPlaylist(id){

 const playlist=playlists.find(p=>p.id===id);

 if(!playlist||!playlist.songs.length)return;

 playSong(playlist,0);
}

function playSong(playlist,index){

 const song=playlist.songs[index];

 if(!song)return;

 currentPlaylist=playlist;
 currentIndex=index;

 loadSong(song);
}

async function loadSong(song){

 if(!song)return;

 if(!song.url && song.storageId){

  try{
   const file=await getFile(song.storageId);

   if(file){
    song.url=URL.createObjectURL(file);
    objectUrls.push(song.url);
   }
  }catch(e){
   console.error(e);
  }
 }

 if(!song.url){
  alert("Ce fichier audio n'est plus disponible.");
  return;
 }

 audio.src=song.url;
 audio.load();

 updatePlayer(song);
 updateMediaSession(song);

 try{
  await audio.play();
 }catch(e){
  console.warn("Lecture bloquée:",e);
  isPlaying=false;
  updatePlayButton();
 }
}

function updatePlayer(song){

 document.getElementById("player-title").textContent=
  song.title||"Aucune chanson";

 document.getElementById("player-artist").textContent=
  song.artist||"Spotity";

 document.getElementById("player-cover").src=
  song.cover||generatedCover(song.title);

 const fav=document.getElementById("player-favorite");

 fav.classList.toggle(
  "active",
  isFavorite(song.id)
 );

 fav.dataset.id=song.id;
}

function updatePlayButton(){

 const icon=document.getElementById("play-icon");

 icon.innerHTML=isPlaying
 ?`<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>`
 :`<path d="M8 5v14l11-7z"/>`;
}

/* =========================================================
   NEXT / PREVIOUS
   ========================================================= */

function nextSong(){

 if(!currentPlaylist)return;

 const songs=currentPlaylist.songs;

 if(!songs.length)return;

 let next;

 if(shuffle){

  if(songs.length===1){
   next=0;
  }else{
   do{
    next=Math.floor(Math.random()*songs.length);
   }while(next===currentIndex);
  }

 }else{

  next=currentIndex+1;

  if(next>=songs.length){
   if(repeat){
    next=0;
   }else{
    isPlaying=false;
    updatePlayButton();
    return;
   }
  }
 }

 playSong(currentPlaylist,next);
}

function previousSong(){

 if(!currentPlaylist)return;

 if(audio.currentTime>3){
  audio.currentTime=0;
  return;
 }

 let previous=currentIndex-1;

 if(previous<0){
  previous=repeat
   ?currentPlaylist.songs.length-1
   :0;
 }

 playSong(currentPlaylist,previous);
}

/* =========================================================
   MEDIA SESSION
   AIRPODS / ECRAN VERROUILLÉ
   ========================================================= */

function updateMediaSession(song){

 if(!("mediaSession" in navigator)||!song)return;

 try{

  const artwork=[];

  if(song.cover){
   artwork.push({
    src:song.cover,
    sizes:"300x300",
    type:"image/jpeg"
   });
  }

  navigator.mediaSession.metadata=
   new MediaMetadata({
    title:song.title||"Spotity",
    artist:song.artist||"Fichier local",
    album:currentPlaylist?.name||"Spotity",
    artwork
   });

 }catch(e){
  console.warn("Media Session:",e);
 }
}

function setupMediaSession(){

 if(!("mediaSession" in navigator))return;

 try{

  navigator.mediaSession.setActionHandler(
   "play",
   ()=>audio.play()
  );

  navigator.mediaSession.setActionHandler(
   "pause",
   ()=>audio.pause()
  );

  navigator.mediaSession.setActionHandler(
   "nexttrack",
   ()=>nextSong()
  );

  navigator.mediaSession.setActionHandler(
   "previoustrack",
   ()=>previousSong()
  );

  navigator.mediaSession.setActionHandler(
   "seekbackward",
   details=>{
    audio.currentTime=Math.max(
     0,
     audio.currentTime-(details.seekOffset||10)
    );
   }
  );

  navigator.mediaSession.setActionHandler(
   "seekforward",
   details=>{
    audio.currentTime=Math.min(
     audio.duration||Infinity,
     audio.currentTime+(details.seekOffset||10)
    );
   }
  );

 }catch(e){
  console.warn("Media Session indisponible:",e);
 }
}

/* =========================================================
   AUDIO EVENTS
   ========================================================= */

audio.addEventListener("play",()=>{

 isPlaying=true;
 updatePlayButton();

 if("mediaSession" in navigator)
  navigator.mediaSession.playbackState="playing";
});

audio.addEventListener("pause",()=>{

 isPlaying=false;
 updatePlayButton();

 if("mediaSession" in navigator)
  navigator.mediaSession.playbackState="paused";
});

audio.addEventListener("ended",()=>{

 if(repeat){
  audio.currentTime=0;
  audio.play();
 }else{
  nextSong();
 }
});

audio.addEventListener("timeupdate",()=>{

 const progress=document.getElementById("progress");

 if(audio.duration){

  progress.max=audio.duration;
  progress.value=audio.currentTime;

  document.getElementById("current-time").textContent=
   formatTime(audio.currentTime);

  document.getElementById("total-time").textContent=
   formatTime(audio.duration);

  if("mediaSession" in navigator &&
     "setPositionState" in navigator.mediaSession){

   try{
    navigator.mediaSession.setPositionState({
     duration:audio.duration,
     playbackRate:audio.playbackRate,
     position:Math.min(audio.currentTime,audio.duration)
    });
   }catch{}
  }
 }
});

audio.addEventListener("loadedmetadata",()=>{

 const progress=document.getElementById("progress");

 if(audio.duration){

  progress.max=audio.duration;

  document.getElementById("total-time").textContent=
   formatTime(audio.duration);
 }
});

/* =========================================================
   IMPORT AUDIO
   ========================================================= */

function importAudio(){

 const input=document.createElement("input");

 input.type="file";

 /*
  IMPORTANT :
  audio/*
  + formats courants
  + accept multiple
  */
 input.accept=
  "audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus";

 input.multiple=true;

 input.onchange=async e=>{

  const files=Array.from(e.target.files||[]);

  if(!files.length)return;

  const validFiles=files.filter(file=>{
   const name=file.name.toLowerCase();

   return(
    file.type.startsWith("audio/") ||
    /\.(mp3|m4a|aac|wav|flac|ogg|oga|opus)$/i.test(name)
   );
  });

  if(!validFiles.length){

   alert(
    "Aucun fichier audio valide.\n\n"+
    "Sélectionne un MP3, M4A, AAC, WAV, FLAC, OGG ou OPUS."
   );

   return;
  }

  const name=prompt(
   "Nom de la playlist :",
   "Ma playlist"
  );

  if(!name||!name.trim())return;

  const playlist={
   id:"playlist_"+Date.now()+"_"+Math.random().toString(36).slice(2),
   name:name.trim(),
   description:"Mes fichiers audio",
   cover:generatedCover(name.trim()),
   songs:[]
  };

  for(let i=0;i<validFiles.length;i++){

   const file=validFiles[i];

   const storageId=
    "audio_"+Date.now()+"_"+i+"_"+Math.random().toString(36).slice(2);

   await saveFile(storageId,file);

   const metadata=
    await readMP3Metadata(file);

   let cover=
    await extractMP3Cover(file);

   let coverType="generated";

   if(cover)
    coverType="embedded";
   else
    cover=generatedCover(metadata.title);

   const song={
    id:"song_"+Date.now()+"_"+i+"_"+Math.random().toString(36).slice(2),
    storageId,
    title:metadata.title,
    artist:metadata.artist,
    duration:"0:00",
    cover,
    coverType,
    playlistId:playlist.id,
    playlistName:playlist.name,
    url:null
   };

   /*
    On crée immédiatement une URL utilisable
    pour la session actuelle.
   */
   const objectUrl=URL.createObjectURL(file);

   song.url=objectUrl;
   objectUrls.push(objectUrl);

   playlist.songs.push(song);
  }

  playlists.push(playlist);
  saveData();

  renderAll();

  openPlaylist(playlist.id);

  /*
   Première musique prête à être lue.
   */
  if(playlist.songs.length===1){
   playSong(playlist,0);
  }

  alert(
   validFiles.length+
   " musique"+(validFiles.length>1?"s":"")+
   " importée"+(validFiles.length>1?"s":"")+
   " avec succès."
  );
 };

 input.click();
}

/* =========================================================
   IMPORT M3U
   ========================================================= */

function importM3U(){

 const input=document.createElement("input");

 input.type="file";
 input.accept=".m3u,.m3u8,audio/x-mpegurl,text/plain";

 input.onchange=e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=event=>{

   const text=event.target.result;
   const lines=text.split(/\r?\n/);

   const songs=[];
   let metadata=null;

   for(const raw of lines){

    const line=raw.trim();

    if(line.startsWith("#EXTINF")){

     const comma=line.indexOf(",");

     if(comma!==-1){

      const info=line.substring(comma+1).trim();
      const dash=info.indexOf(" - ");

      metadata={
       artist:dash!==-1
        ?info.substring(0,dash)
        :"Artiste inconnu",

       title:dash!==-1
        ?info.substring(dash+3)
        :info,

       duration:
        line.match(/#EXTINF:\s*(-?\d+)/)?.[1]||"0"
      };
     }

    }else if(
     line.startsWith("http://")||
     line.startsWith("https://")
    ){

     const data=metadata||{
      artist:"Artiste inconnu",
      title:"Titre inconnu",
      duration:"0"
     };

     songs.push({
      id:"m3u_"+Date.now()+"_"+songs.length,
      title:data.title,
      artist:data.artist,
      duration:formatTime(parseInt(data.duration)||0),
      url:line,
      cover:generatedCover(data.title),
      coverType:"generated"
     });

     metadata=null;
    }
   }

   if(!songs.length){

    alert("Aucune musique compatible trouvée dans ce M3U.");
    return;
   }

   const name=prompt(
    "Nom de la playlist :",
    file.name.replace(/\.[^/.]+$/,"")
   );

   if(!name)return;

   const playlist={
    id:"m3u_"+Date.now(),
    name:name.trim(),
    description:"Playlist M3U",
    cover:generatedCover(name),
    songs
   };

   playlist.songs.forEach(song=>{
    song.playlistId=playlist.id;
    song.playlistName=playlist.name;
   });

   playlists.push(playlist);
   saveData();
   renderAll();
   openPlaylist(playlist.id);
  };

  reader.readAsText(file);
 };

 input.click();
}

/* =========================================================
   SUPPRESSION PLAYLIST
   ========================================================= */

async function deletePlaylist(id){

 const playlist=playlists.find(p=>p.id===id);

 if(!playlist)return;

 const ok=confirm(
  `Supprimer la playlist "${playlist.name}" ?\n\n`+
  `Les fichiers audio importés dans cette playlist seront également supprimés.`
 );

 if(!ok)return;

 for(const song of playlist.songs){

  if(song.storageId){
   await deleteFile(song.storageId);
  }

  if(song.url?.startsWith("blob:")){
   try{URL.revokeObjectURL(song.url)}catch{}
  }
 }

 playlists=playlists.filter(p=>p.id!==id);

 if(currentPlaylist?.id===id){

  currentPlaylist=null;
  currentIndex=-1;
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  isPlaying=false;
  updatePlayButton();
 }

 saveData();

 document.getElementById("context-menu").style.display="none";

 document.querySelectorAll(".view")
  .forEach(v=>v.classList.remove("active"));

 document.getElementById("home-view")
  .classList.add("active");

 renderAll();
}

}

   );

    .textContent=name.trim();
  }
 });

/* =========================================================
   INITIALISATION
   ========================================================= */

async function init(){

 loadData();

 const savedName=
  localStorage.getItem("spotity_profile_name");

 if(savedName)
  document.getElementById("profile-name")
   .textContent=savedName;

 renderAll();

 setupMediaSession();

 try{
  await openDB();
  await restoreFiles();
 }catch(e){
  console.error(
   "IndexedDB indisponible:",
   e
  );
 }

}

/*
 Nettoyage des anciennes URLs de session
 */
window.addEventListener("beforeunload",()=>{
 objectUrls.forEach(url=>{
  try{URL.revokeObjectURL(url)}catch{}
 });
});

init();

</script>
